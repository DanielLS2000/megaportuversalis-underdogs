l_english:
 rusvin_banner: "Under the Rusvin Banner"
 rusvin_banner_desc: "For generations the warriors of Mordoviya fought beneath many lords, through dynastic struggles, foreign domination and wars along the Volga. The struggle for freedom changed that. In the forests, Rusvin infantry defeated the forces sent to keep the realm in submission and proved that the people of Mordoviya could decide their own fate. From then on, the Rusvin banner came to stand for soldiers who would hold their ground against any prince, khan or invader."

 broken_crown: "The Broken Crown Endures"
 broken_crown_desc: "The Mongol conquest shattered the old order. The main royal line was destroyed, the realm was forced into submission and a distant kinsman from Smolensk inherited a crown that survived beneath the authority of the khans. Yet the crown itself endured. As the great hordes fractured and their power waned, what had once symbolized defeat became proof that Mordoviya had survived its conquerors."

 moscow_reforged: "Moscow Reforged"
 moscow_reforged_desc: "Moscow had been lost, contested and recovered more than once during the long struggles of the realm. When it finally became the secure heart of Rusvin rule, the crown poured its strength into the city and the lands around it. Trade, production and development expanded until the economy of the realm multiplied, turning Moscow from a recovered prize into the engine of Rusvin power."

 crown_rebuilt: "The Crown Rebuilt in Stone"
 crown_rebuilt_desc: "The Rusvin realm had survived partition, reconquest and foreign domination, but survival alone was no longer enough. Feudal institutions were established, castles and permanent centers of authority spread through the crown lands, and Moscow became the fixed center of government. The state that emerged was no longer the fragile kingdom the hordes had once broken, but a realm built to endure."

 persian_generation: "The Persian Generation"
 persian_generation_desc: "For twenty-five years the crusade in Persia consumed armies, treasure and an entire generation of warriors. The campaign ended in defeat and left an immense human cost, but those years of distant war changed the army forever. The veterans who returned carried with them the experience of long campaigns, sieges and survival far from home, and their lessons became part of the military tradition of the Rusvin realm."

 making_rusvin: "The Making of the Rusvin"
 making_rusvin_desc: "The Rusvin were not created by a single ruler or a single victory. Mordvin roots, the cities and peoples of the Rus, the Catholic faith and centuries of life between forest and steppe were gradually woven into a new identity. The strength of the Rusvin lay in taking what history had placed before them and making it their own, without forgetting the land and people from which the realm had begun."

 tribute_to_toll: "From Tribute to Toll"
 tribute_to_toll_desc: "There had been a time when wealth left Mordoviya along the Volga as tribute to foreign khans. That age ended as the hordes broke apart and Rusvin power rose in their place. The same river roads that had once carried submission now linked Moscow, the Volga, the Russian cities and the steppe under Rusvin protection. The Volga no longer carried our tribute; it carried our wealth."