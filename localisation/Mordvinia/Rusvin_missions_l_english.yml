l_english:
 fin_independence_title:0 "The Crown Unbowed"
 fin_independence_desc:0 "The khans could humble our kings, but they could not extinguish the crown. It endured when the old dynasty fell, carrying the memory of a realm that had once answered to itself.\n\nSecure our peace, restore our finances and win friends abroad. Let independence become an inheritance no foreign ruler can take from our children. §YNever again shall we kneel.§!"
 mos_rus_land_of_churches_title:0 "Bells Across Rusvin"
 mos_rus_land_of_churches_desc:0 "Our ancestors chose their faith while the realm still stood between hostile powers. What began as the conviction of a crown must now take root in every town and village.\n\nRaise churches and gather a learned clergy around them. Their bells shall proclaim a people united in worship, certain of its place in Christendom and determined to defend it."
 mos_secure_muscovys_future_title:0 "Restore Royal Authority"
 mos_secure_muscovys_future_desc:0 "Foreign conquest taught our lords to look beyond their own king for permission to rule. That humiliation must end in the council chamber as surely as it ended on the battlefield.\n\nRestore the dignity of the throne through capable government and resolute leadership. Our laws shall bear the authority of our own crown, and our future shall be settled within our own borders."
 fin_neva_title:0 "The Moscow Citadel"
 fin_neva_desc:0 "Moscow is more than a recovered city. It is the seat from which a battered kingdom has begun to command its own destiny. To leave it exposed would betray everything won in its defence.\n\nStrengthen its walls and secure the lands around it. Here our enemies shall meet the stone, steel and resolve of a crown they failed to destroy."
 fin_baltic_empire_title:0 "An Empire on the Volga"
 fin_baltic_empire_desc:0 "We have known the weakness of divided principalities and the indignity of foreign command. A greater realm must rise from those memories, gathering the Russian lands into an authority strong enough to endure.\n\nBring the country beneath our dominion and claim the standing our strength deserves. §YThe age of tribute shall give way to the age of empire.§!"
 liv_lva_construct_markets_title:0 "Markets of the Heartland"
 liv_lva_construct_markets_desc:0 "The roads of the heartland once carried the demands of rival lords. Now they must carry the wealth of a united country. Moscow, Tver and Vladimir shall prosper together, their markets joined to the northern trade through Novgorod.\n\nBuild the exchanges that turn a harvest into revenue and a workshop into a livelihood. Every thriving town will make the crown less dependent on fortune and more secure in its own strength."
 liv_lva_dominate_lubeck_trade_title:0 "Trade Under Our Banner"
 liv_lva_dominate_lubeck_trade_desc:0 "A merchant who travels beneath our banner must know that the crown stands behind him. Roads opened by enterprise cannot be surrendered to rivals who mistake commerce for weakness.\n\nEstablish a lasting place in the markets and compel respect for our interests. Let our trading houses carry abroad the confidence our armies have won at home."
 liv_lva_trade_in_india_title:0 "Markets of Siberia"
 liv_lva_trade_in_india_desc:0 "Beyond the Urals, rivers bind the western Siberian settlements together more firmly than any road. Whoever commands their markets and river mouths will shape the future of the frontier.\n\nSecure these exchanges for our merchants. The eastern trade shall sustain towns loyal to the crown and reward the country that opened the way."
 mos_rus_conquer_novgorod_title:0 "Gather the Northern Lands"
 mos_rus_conquer_novgorod_desc:0 "The northern towns have grown wealthy behind their rivers and forests, but wealth alone cannot shield them from a divided world. Their future belongs with the realm rising around Moscow.\n\nGather the northern lands beneath our authority. Their commerce and our strength shall become the foundations of a common greatness."
 mos_rus_partition_poland_title:0 "Gather Ruthenia"
 mos_rus_partition_poland_desc:0 "The lands of Ruthenia have too often been the prize of rival rulers. We shall offer an order strong enough to outlast their quarrels, binding their towns and peoples to the crown.\n\nEstablish our dominion and give those brought within it a lasting place in the realm. Victory must leave behind more than a frontier; it must leave a country that can endure."
 mos_rus_protect_south_slavs_title:0 "The Slavic Concord"
 mos_rus_protect_south_slavs_desc:0 "A crown that rules many peoples must give them more than a common master. Across the western Slavic lands, old divisions still weaken those who could stand together.\n\nExtend our authority and forge a lasting concord among the Slavic peoples. Let the realm become the centre around which their shared strength can gather."
 fin_grow_farms_title:0 "Bread for the Realm"
 fin_grow_farms_desc:0 "No crown can stand securely above an empty granary. The labour of our villages feeds the soldiers, sustains the towns and gives the country the strength to grow.\n\nImprove the fields and fisheries, and help rural workshops flourish. Let prosperity reach the people whose work makes every royal ambition possible."
 rus_handle_the_boyars_title:0 "The Crown and the Boyars"
 rus_handle_the_boyars_desc:0 "The great families remember when the weakness of the throne made every estate a kingdom of its own. They must now learn what service to a united realm requires.\n\nSettle their place through loyalty or the firm exercise of royal authority. The fortunes of a few houses shall no longer outweigh the future of the country."
 rus_the_mestnichestvo_title:0 "Service Above Birth"
 rus_the_mestnichestvo_desc:0 "A famous ancestor cannot command an army for an incapable descendant. The offices of the realm have too long been treated as heirlooms rather than duties.\n\nBreak the privileges that place lineage above ability and root corruption out of public service. Let the crown reward those who strengthen the country, whatever the age of their family name."
 rus_book_of_royal_degrees_title:0 "The Rusvin Lawbook"
 rus_book_of_royal_degrees_desc:0 "The realm has been gathered by generations of struggle; it must not remain divided by a hundred competing laws. A subject should know the authority of the crown wherever its banner flies.\n\nBring our decrees into a lasting body of law and place their enforcement in capable hands. What the sword has united, orderly government shall preserve."
 rus_control_fur_trade_title:0 "The Wealth of the Forests"
 rus_control_fur_trade_desc:0 "The forests once sheltered our people from armies they could not meet in the open. Now those same woodlands can furnish the wealth of a great power.\n\nCommand the fur trade and bring its revenues into a well-governed treasury. The land that preserved us in adversity shall sustain our ascendancy."
 mos_rus_build_up_army_title:0 "Muster the Rusvin Host"
 mos_rus_build_up_army_desc:0 "Our people have not forgotten the sound of foreign horsemen approaching undefended towns. Freedom won in one campaign will not survive without an army able to defend it in the next.\n\nMuster the regiments and give them the means to remain in the field. §YOur fate shall be decided beneath our own banners.§!"
 mos_rus_eliminate_the_minors_title:0 "One Rusvin Crown"
 mos_rus_eliminate_the_minors_desc:0 "Partition made brothers into rivals and left each fragment of the realm at the mercy of stronger neighbours. We have paid too dearly for that weakness to preserve it.\n\nGather the towns and principalities beneath one authority. Let the divisions that once broke our strength disappear before a crown determined never to divide it again."
 mos_rus_end_the_tatar_yok_title:0 "The Fall of the Hordes"
 mos_rus_end_the_tatar_yok_desc:0 "The end of tribute did not erase the powers that claimed the right to collect it. So long as their dominions endure, another khan may dream of restoring the old submission.\n\nBreak the remnants of that order and close the road back to servitude. §YThe crown shall outlive the last of its conquerors.§!"
 mos_rus_carpathian_conquest_title:0 "Peoples of the Urals"
 mos_rus_carpathian_conquest_desc:0 "The Urals must become more than the distant edge of our maps. Their lands and peoples belong within the future the crown is building to the east.\n\nExtend our authority and recognise the place of the Bashkir, Nogaybak and Oghuz peoples within the realm. A frontier held by lasting allegiance will carry our power further than a frontier held by fear alone."
 rus_the_streltsy_title:0 "The Crown's Regiments"
 rus_the_streltsy_desc:0 "The kingdom once called its warriors together only when danger was already at the gates. A great state cannot entrust its survival to such uncertainty.\n\nGive the crown enduring regiments, hardened by service and bound by discipline. Our soldiers shall carry the memory of earlier struggles into an army prepared for the wars to come."
 mos_rus_conquer_persia_title:0 "The Caspian Trade Routes"
 mos_rus_conquer_persia_desc:0 "The trade routes of the Black Sea, the Volga and the Caspian connect our realm to the caravan cities of the east. We must cease to be a distant spectator to the wealth passing along them.\n\nSecure their markets or bind a powerful ally of our faith to our cause. Through commerce or diplomacy, the crown shall make its influence felt across these roads."
 fin_fourth_rome_title:0 "The Shield of the Faith"
 fin_fourth_rome_desc:0 "Our ancestors embraced the Catholic faith when their kingdom could scarcely guarantee its own survival. Their descendants now have the chance to become its shield.\n\nUnite the realm, raise a capital worthy of its calling and assemble an army that commands respect. Let Christendom look to the nation that survived the khans and see a defender equal to its trials."
 rus_the_vodka_monopoly_title:0 "The Crown's Distilleries"
 rus_the_vodka_monopoly_desc:0 "The harvest sustains more than our tables. Across the countryside, distilleries turn grain into a trade whose proceeds should serve the state that protects it.\n\nPlace this industry upon a firm foundation under royal authority. The wealth produced in our own villages shall help finance the greatness of our own realm."
 rus_solidify_serfdom_title:0 "Crown, Lords and Peasants"
 rus_solidify_serfdom_desc:0 "The strength of the countryside rests upon a settlement between those who hold the land and those who work it. Their disputes cannot be allowed to pull the realm apart.\n\nEstablish the crown's chosen order and overcome the resistance that obstructs it. The government of our villages must answer to a lasting policy, not to an endless contest of private wills."
 liv_lva_competent_rule_title:0 "The Rusvin State Diet"
 liv_lva_competent_rule_desc:0 "A realm of growing power needs a place where its affairs can be settled with dignity and authority. The estates must bring their petitions before a government capable of both hearing and deciding.\n\nGather able councillors around the crown and give the State Diet a permanent seat. Let the institutions of the country become as enduring as the throne they serve."
 rus_peters_reforms_title:0 "The Great Rusvin Reforms"
 rus_peters_reforms_desc:0 "Survival made us a kingdom; ambition must now make us a leading power. We cannot live forever upon the victories of our ancestors while other states master the knowledge of a new age.\n\nReform our institutions and make the finest methods of government our own. The country that learned to endure shall now learn to lead."
 rus_early_industrialization_title:0 "The Great Manufactories"
 rus_early_industrialization_desc:0 "Our towns must do more than receive the riches of the land. Their workshops can turn those riches into the tools, wares and supplies upon which a powerful country depends.\n\nRaise manufactories and gather skilled labour around them. Let our ambitions be sustained by the industry of our own people."
 rus_establish_the_russian_navy_title:0 "The Rusvin Admiralty"
 rus_establish_the_russian_navy_desc:0 "A banner respected on land should not become a stranger at the water's edge. Our ports and merchants deserve the protection of a fleet worthy of the realm.\n\nBuild our ships, train our admirals and establish a lasting naval tradition. The seas shall become another road upon which our country carries its power."
 mos_rus_conquer_the_great_horde_title:0 "End the Tribute"
 mos_rus_conquer_the_great_horde_desc:0 "For generations, the fruits of our labour travelled away as payment for the privilege of remaining alive. Every demand for tribute renewed the shame imposed upon the crown.\n\nTake the stronghold from which that authority is exercised and break its hold upon us. §YWhat our people earn shall no longer belong to a khan.§!"
 mos_rus_conquer_the_caucasus_title:0 "Secure the Mountain Gates"
 mos_rus_conquer_the_caucasus_desc:0 "The mountain passes of the Caucasus stand between the open steppe and the southern lands. To leave them beyond our influence is to leave a gate through which danger may return.\n\nSecure these approaches by conquest or entrust them to a powerful ally of our faith. Our southern frontier shall rest upon strength that every neighbouring court must recognise."
 mos_rus_conquer_central_asia_title:0 "Masters of the Caravans"
 mos_rus_conquer_central_asia_desc:0 "The caravan cities have long exchanged the wealth of distant kingdoms. Our merchants shall no longer approach them as petitioners dependent upon another ruler's goodwill.\n\nSecure the great markets of Central Asia and establish our place along their roads. Let the trade of the continent acknowledge the power that has risen from the northern forests."
 liv_lva_colonize_west_africa_title:0 "The Siberian Goldfields"
 liv_lva_colonize_west_africa_desc:0 "Beyond the Urals, the frontier holds wealth worthy of the hardships required to secure it. The western Siberian goldfields must become an enduring possession of the crown.\n\nProtect the settlements and bring their mines into productive use. Their riches shall sustain the towns and expeditions that carry our realm further east."
 liv_lva_dominate_colonial_trade_title:0 "The Wealth of Eurasia"
 liv_lva_dominate_colonial_trade_desc:0 "There was a time when we could scarcely protect the wealth moving along our own rivers. Now our merchants follow routes that bind the northern forests to the markets of Asia.\n\nEstablish their ascendancy across the continent's great exchanges. Let the wealth of east and west strengthen a country that once paid others for its peace."
 liv_lva_develop_livonia_title:0 "A Flourishing Heartland"
 liv_lva_develop_livonia_desc:0 "Moscow, Tver and Vladimir have borne the burdens of our recovery. Their people deserve to see the crown's victories reflected in flourishing towns and prosperous lands.\n\nDevelop the heartland until its strength matches the ambitions it sustains. The greatness of the realm shall be visible in the country itself, not merely proclaimed at court."
 fin_handle_the_sami_title:0 "Unite the Northern Forests"
 fin_handle_the_sami_desc:0 "The northern forests sheltered the beginnings of our power. Their distant communities must share in the future of the realm, from Vologda and Arkhangelsk to Perm.\n\nUnite them in faith and recognise their peoples within the state. A north bound by allegiance and settlement shall remain a source of strength through every trial ahead."
 liv_fortify_land_title:0 "Bastions of Rusvin"
 liv_fortify_land_desc:0 "The roads to Moscow, Novgorod and Smolensk lead into the lands upon which our power rests. We know too well what follows when those approaches lie open.\n\nRaise fortresses equal to the weapons of our age and prepare their garrisons for the fiercest assault. Let every invader discover how dearly this country values its freedom."
 rus_the_courts_direction_title:0 "Knowledge for the Crown"
 rus_the_courts_direction_desc:0 "A court concerned only with its own ceremonies will soon be overtaken by the world beyond its walls. The crown needs minds able to turn knowledge into strength.\n\nBring scholars and capable advisers into our service, and open ties with the learned circles of the west. What we discover abroad shall take root at home and serve the advancement of our country."
 fin_abo_academy_title:0 "The Moscow Academy"
 fin_abo_academy_desc:0 "The city that became the seat of our recovery must also become a home for learning. Moscow shall gather scholars whose work can endure long after the campaigns of their age are forgotten.\n\nEstablish the academy upon the prosperity of the capital. Let future generations find within their own country the knowledge needed to guide it."
 rus_reform_the_military_title:0 "The Rusvin Art of War"
 rus_reform_the_military_desc:0 "Experience bought with the lives of our soldiers must never be lost when a campaign ends. Every regiment should inherit the lessons that earlier generations learned at such cost.\n\nJoin rigorous training to the finest military methods of the age. Our enemies shall face an army shaped by memory, discipline and the determination to remain master of its own country."
 rus_monopolize_novgorod_title:0 "The Great Trading Charter"
 rus_monopolize_novgorod_desc:0 "The wealth of our markets should strengthen our own trading houses and the state that guards them. A commanding commercial position gives the crown the means to set terms rather than accept them.\n\nSecure that position and grant a charter worthy of our merchants' success. Let royal authority turn commercial strength into lasting prosperity."
 mdv_rusvin_liv_handle_teutonic_order_title:0 "The Bulgar Inheritance"
 mdv_rusvin_liv_handle_teutonic_order_desc:0 "Blood, rivalry and the Volga bind the fate of Bulgaria to our own. The old division has lasted through generations of changing fortunes; it need not dictate the future.\n\nWin its friendship or assert our dynastic claim to a closer union. The settlement of these crowns shall reflect the strength our realm has regained."
 mdv_rusvin_mos_rus_conquer_kazan_title:0 "Masters of the Volga"
 mdv_rusvin_mos_rus_conquer_kazan_desc:0 "The Volga once carried wealth away beneath the demands of foreign rulers. Its towns and tributaries must now become the arteries of our own power.\n\nGather the lands around Kazan and beyond beneath the crown. The river that witnessed our submission shall witness the prosperity of a united realm."
 mdv_rusvin_mos_rus_expand_eastwards_title:0 "Banners over the Steppe"
 mdv_rusvin_mos_rus_expand_eastwards_desc:0 "Beyond the Volga lie the steppe roads that once brought danger to our doors. We shall meet that frontier with the confidence of a country that has recovered its strength.\n\nExtend our authority toward the Caspian and establish the foundations of lasting government. Our banners shall mark the advance of a realm determined to shape its own horizons."
 mdv_rusvin_mos_rus_colonize_west_siberia_title:0 "Beyond the Urals"
 mdv_rusvin_mos_rus_colonize_west_siberia_desc:0 "The Urals once seemed to mark the limit of the familiar world. They shall become the gateway through which our settlers carry the realm into Siberia.\n\nSecure the first settlements and bind them to the crown through government and trade. Let the crossing become a road that families can follow, not merely an expedition that soldiers survive."
 mdv_rusvin_mos_rus_colonize_central_siberia_title:0 "Across the Great Taiga"
 mdv_rusvin_mos_rus_colonize_central_siberia_desc:0 "River by river, our settlements reach deeper into the taiga. Distance must not loosen their bonds to the country that sent them east.\n\nEstablish a centre of commerce able to sustain the frontier and connect its scattered towns. What begins as a distant outpost shall become an enduring part of the realm."
 mdv_rusvin_mos_rus_colonize_eastern_siberia_title:0 "Banners on the Pacific"
 mdv_rusvin_mos_rus_colonize_eastern_siberia_desc:0 "The forests open at last upon a shore beyond which there is only ocean. A crown once confined beneath the authority of the khans can now carry its banner across a continent.\n\nSecure the coast and establish a harbour worthy of that achievement. §YLet the Pacific mark the reach of our resolve.§!"
 mdv_rusvin_liv_lva_riga_capital_title:0 "Moscow, Heart of Rusvin"
 mdv_rusvin_liv_lva_riga_capital_desc:0 "Moscow was recovered through struggle; it must now be made worthy of everything sacrificed for it. Its churches, workshops and markets shall give visible form to the strength of the restored crown.\n\nRaise a capital in which commerce and government flourish together. Let all who enter its gates understand that the realm gathered here intends to endure."
 mdv_rusvin_fin_high_income_title:0 "A Prosperous Treasury"
 mdv_rusvin_fin_high_income_desc:0 "Freedom is fragile when the treasury cannot sustain it. A crown burdened by debt and uncertain revenues will always find its ambitions at the mercy of others.\n\nExpand our income, settle our obligations and entrust the finances to capable hands. The realm shall possess the means to build, govern and defend the future it has claimed."
 mdv_rusvin_liv_lva_construct_universities_title:0 "The Rusvin Enlightenment"
 mdv_rusvin_liv_lva_construct_universities_desc:0 "The learning gathered in our capital must spread throughout the country. A great realm needs more than one academy and more than a handful of scholars favoured by the court.\n\nEstablish universities in our prosperous towns and give knowledge a lasting home. Let a generation educated here carry the name of our country into the foremost ranks of a new age."
 mdv_rusvin_develop_heartland_tt:0 "All required provinces in §YMoscow§!, §YTver§! and §YVladimir§!:\n  Are owned by §Y[Root.GetName]§!.\n  Have at least §Y10 development§!."
 own_all_kazan_provinces_tt:0 "All land provinces in the §YKazan§! trade node are owned by us or our §Ynon-sovereign subjects§!."
 rusvin_siberian_trade_tt:0 "Control at least §Y4§! provinces with a §YCenter of Trade§! or §YRiver Estuary§! across the designated Siberian regions."
 rusvin_tatar_claims_tt:0 "Gain claims on all provinces of the §YTatar§! culture group in §YCentral Asia§!."
 rusvin_central_asia_trade_at:0 "Own or have non-sovereign subjects own at least §Y6§! provinces in the designated regions with:\n  A §YRiver Estuary§! or a §YCenter of Trade§!."
 rusvin_central_asia_ally_bt:0 "Have an ally that:\n  Belongs to our §Yreligious group§!.\n  Has its capital in §YCentral Asia§!.\n  Owns, directly or through non-sovereign subjects, at least §Y20§! provinces in §YCentral Asia§!."
 rusvin_central_asia_trade_ct:0 "§YCommercial Dominance§!\nDominating the markets of §YSamarkand§! will secure Rusvin influence over the great trade routes of §YCentral Asia§!."
 rusvin_central_asia_ally_dt:0 "§YA Powerful Ally§!\nSecure our interests through a powerful ally of our faith in §YCentral Asia§!."
 RUS_CENTRAL_ASIAN_TRADE:0 "Rusvin Trade in Samarkand"
 rusvin_siberian_goldfields_tt:0 "Every owned province producing §YGold§! in §YWest Siberia§! gains §YIntensified Gold Mining§! until the end of the game, giving:\n  Local Goods Produced Modifier: §G+50.0%§!\n  Local Gold Depletion Chance: §G-15.0%§!"
 rusvin_dominate_eurasian_trade_tt:0 "Be the §Ystrongest Trade Power§! or control at least §Y35%§! of trade in §Y4§! of these nodes:\n§YNovgorod, Kazan, Astrakhan, Crimea§!\n§YSiberia, Samarkand, Yumen, Xi'an§!\n§YBeijing, Girin, Lhasa, Lahore§!\n§YPersia, Basra, Hormuz, Aleppo§!."
 mdv_rusvin_heartland_reward_tt:0 "Every owned province in §YMoscow§!, §YTver§! and §YVladimir§! with at least §Y10 development§! gains §YExpanded Lands§! for §Y25 years§!, giving:\n  Local Construction Cost: §G-15.0%§!\n  Local Construction Time: §G-25.0%§!\n  Local Unrest: §G-2.00§!"
 mdv_rusvin_fortify_land_tt:0 "§Y4§! eligible fortified provinces in §YMoscow§!, §YNovgorod§! and §YSmolensk§! gain §YFortified Border§! until the §Yend of the game§!, giving:\n  Local Defensiveness: §G+50.0%§!\n  Local Garrison Size: §G+25.0%§!\n  Local Fort Maintenance: §G-90.0%§!\n\nGain a §Yskill 2 Military Engineer§! with §G50%§! reduced hiring cost and salary."
 fin_claim_crimea_trade_node_tt:0 "Gain §Ypermanent claims§! on all provinces in the §YCrimea§! trade node that we do not already own or have cores on."
