l_english:
 my_ideas:0 "Rusvin Ideas"
 my_ideas_start:0 "Rusvin Traditions"
 my_ideas_bonus:0 "Rusvin Ambition"
 idea1:0 "Under the Rusvin Banner"
 idea1_desc:0 "For generations the warriors of Mordoviya fought beneath many lords, through dynastic struggles, foreign domination and wars along the Volga. The struggle for freedom changed that. In the forests, Rusvin infantry defeated the forces sent to keep the realm in submission and proved that the people of Mordoviya could decide their own fate. From then on, the Rusvin banner came to stand for soldiers who would hold their ground against any prince, khan or invader."
 idea2:0 "Beyond the Ural Gates"
 idea2_desc:0 "The forests and rivers beyond the Urals shall no longer mark the edge of our world. Hunters, settlers and their families will carry the life of the realm eastward, founding new homes along waterways that lead ever deeper into the continent.\n\nEach settlement shall become a beginning for the next journey. Where our people make their hearths, the crown shall follow, binding distant frontiers to the country they are building together."
 idea3:0 "Moscow Reforged"
 idea3_desc:0 "Moscow had been lost, contested and recovered more than once during the long struggles of the realm. When it finally became the secure heart of Rusvin rule, the crown poured its strength into the city and the lands around it. Trade, production and development expanded until the economy of the realm multiplied, turning Moscow from a recovered prize into the engine of Rusvin power."
 idea4:0 "The Crown Rebuilt in Stone"
 idea4_desc:0 "The Rusvin realm had survived partition, reconquest and foreign domination, but survival alone was no longer enough. Feudal institutions were established, castles and permanent centers of authority spread through the crown lands, and Moscow became the fixed center of government. The state that emerged was no longer the fragile kingdom the hordes had once broken, but a realm built to endure."
 idea5:0 "The Host of Many Peoples"
 idea5_desc:0 "The peoples of the northern forests once faced the ambitions of greater powers apart, each defending its own rivers, villages and ancestral lands. Beneath the Rusvin crown, their strength can at last be gathered into a single host.\n\nLet every province sustain its regiments and every district share in the defence of the realm. An enemy who marches against one of our peoples shall face the assembled strength of them all."
 idea6:0 "The Council of Service"
 idea6_desc:0 "Our realm has paid dearly for the knowledge it possesses. The long Persian war left lessons that must not die with its veterans, while the rebuilding of our towns has brought forward able minds whose worth cannot be measured by ancestry.\n\nOpen royal service to scholars, administrators and experienced officers from across the united realm. A lasting place at court shall draw talent into our service, and the counsel of seasoned soldiers shall preserve the hard-won knowledge of war."
 idea7:0 "The Broken Crown Endures"
 idea7_desc:0 "The Mongol conquest broke the old dynasty and forced our kingdom into submission, yet it could not extinguish the crown. That memory now belongs to every soldier who takes his place beneath its banner.\n\nThe weapons of war have changed, but endurance remains the first duty of the host. Trained to hold their ranks through smoke, shot and the thunder of guns, our regiments shall preserve the resolve that carried the realm through its darkest years. The crown endured; its soldiers shall endure with it."
