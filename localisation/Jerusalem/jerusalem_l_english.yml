l_english:
 koj_papal_relations_title:0 "Sway the Pope"
 koj_papal_relations_desc:0 "The Kingdom of Jerusalem cannot stand alone in a hostile world. The favor of the Holy See would strengthen our legitimacy and give us the blessing, or at least the tolerance, needed to reclaim the lands of the old Crusader states."
 koj_jerusalem_title:0 "Knights of the Temple"
 koj_jerusalem_desc:0 "Jerusalem is the spiritual heart of our kingdom, and its possession is the foundation upon which all our ambitions rest. With the Holy City secure, we can once again call upon the traditions and military orders that once defended the Latin East."
 koj_kingdom_of_heaven_title:0 "Kingdom of Heaven"
 koj_kingdom_of_heaven_desc:0 "The Crusader states once stretched across Syria and the lands east of the Jordan. We shall restore that realm, not as a collection of isolated holdings, but as a single Kingdom of Heaven capable of defending Christendom and commanding the crossroads of the Middle East."
 koj_crusader_fleet_title:0 "Crusader Fleet"
 koj_crusader_fleet_desc:0 "Our kingdom borders two seas, yet our influence cannot extend farther than our ships can sail. A powerful fleet will protect the Holy Land, carry our armies abroad, and ensure that the Crusader cause is never again strangled by a blockade."
 koj_consolidate_egypt_title:0 "Egyptian Consolidation"
 koj_consolidate_egypt_desc:0 "The Nile is the lifeblood of Egypt, but the wealth of the river cannot be secured while its southern reaches remain beyond our firm control. We must consolidate the lands along the Nile and bring the approaches to Nubia under our authority."
 koj_follow_the_nile_title:0 "Follow the Nile"
 koj_follow_the_nile_desc:0 "The Nile has always connected the peoples of northeastern Africa. By following its course beyond Egypt and securing the lands around the great river, we can turn a distant frontier into a natural extension of our kingdom and open the way toward Ethiopia."
 koj_ark_of_the_covenant_title:0 "Ark of the Covenant"
 koj_ark_of_the_covenant_desc:0 "For centuries, traditions have placed the Ark of the Covenant in the highlands of Ethiopia. Whatever the truth of these claims, the relic carries immense spiritual significance. We shall bring its resting place under our protection and remind the world of our sacred mission."
 koj_nubian_conquest_title:0 "Subjugate Nubia"
 koj_nubian_conquest_desc:0 "The peoples of Nubia guard the southern approaches to Egypt and command routes linking the Nile to the Red Sea and the interior. Their lands must be subdued, their frontier secured, and the Kingdom's authority carried deep into the African interior."
 koj_ethiopia_title:0 "The Blue Nile"
 koj_ethiopia_desc:0 "The Blue Nile rises in the Ethiopian highlands, tying the fortunes of Ethiopia to the river upon which Egypt depends. We must establish our influence in the region and decide whether Ethiopia will stand beside us as a friend or yield before our expanding power."
 koj_into_arabia_title:0 "Into Arabia"
 koj_into_arabia_desc:0 "The pilgrimage roads of Arabia lead directly to the holiest cities of Islam, making the Hejaz a land of immense spiritual and political importance. Our advance into Arabia will place these routes within reach of Jerusalem and open a new frontier for the Kingdom."
 koj_arabian_ambition_title:0 "Arabian Ambitions"
 koj_arabian_ambition_desc:0 "Mecca and Medina are more than cities; they are the heart of Arabia and the meeting point of pilgrims from across the Muslim world. By securing the Hejaz, we can project our authority across the peninsula and turn the desert routes to our advantage."
 koj_yemen_title:0 "The Tahiride Realm"
 koj_yemen_desc:0 "Yemen sits astride the gateway between the Red Sea and the Indian Ocean, enriched by fertile highlands and the trade that passes through its ports. The old Tahiride realm once mastered much of this country. We shall take its place and make Yemen part of our wider dominion."
 koj_hormuz_title:0 "Defeat the Hormuzi"
 koj_hormuz_desc:0 "The shores of Oman and the Gulf command the entrance to one of the richest maritime routes in the world. The merchants of Hormuz will not be allowed to dictate the terms of trade forever. We must break their influence and secure the gateway to the Indian Ocean."
 koj_aden_expansion_title:0 "Expand the Port of Aden"
 koj_aden_expansion_desc:0 "Aden is the hinge between the Red Sea and the Arabian Sea. With investment in its harbor and markets, it can become the principal entrepôt through which the wealth of Africa, Arabia, and India flows into our treasury."
 koj_mukha_title:0 "Port of Mukha"
 koj_mukha_desc:0 "The port of Mukha lies on Yemen's western coast, ideally placed to gather the riches of the surrounding highlands. By expanding its harbor and developing its plantations, we can make Mukha a center of prosperity and the foremost port of the Arabian coffee trade."
 koj_masters_of_arabian_sea_title:0 "Masters of Arabian Sea"
 koj_masters_of_arabian_sea_desc:0 "Our ports, merchants, and fleets now reach across the waters of the Arabian Sea. Yet influence is proven not by the number of ships we own, but by the share of trade that follows our flag. We shall make ourselves the masters of these waters."
 koj_coffee_title:0 "Coffee Monopoly"
 koj_coffee_desc:0 "Coffee has become one of the most coveted luxuries of the East, and Yemen's highlands provide an ideal home for its cultivation. We must concentrate production and trade in our hands until no merchant can profit from coffee without enriching Jerusalem."
 koj_eastern_hub_title:0 "The Eastern Trade Hub"
 koj_eastern_hub_desc:0 "From Alexandria to Aden and beyond, our network now links the Mediterranean with the markets of the Indian Ocean. We must ensure that this network converges on our own ports, transforming Jerusalem's eastern possessions into a commercial hub powerful enough to rival the world's greatest trading centers."
 koj_arabia_title:0 "Kingdom of Arabia"
 koj_arabia_desc:0 "Conquest alone cannot make the deserts of Arabia prosperous. We must tame the harsh landscape through wells, canals, and careful management of scarce water, allowing towns and caravan routes to flourish under our rule and binding the peninsula more closely to the Kingdom."
 koj_mercantile_relationship_title:0 "Mercantile Relationships"
 koj_mercantile_relationship_desc:0 "The merchants of Venice have long understood the value of Mediterranean trade. We must decide how best to deal with this powerful maritime republic: as partners who can strengthen our commercial network, or as rivals whose influence must be checked by our own growing fleet."
 koj_arabian_navy_title:0 "Protect the Strait"
 koj_arabian_navy_desc:0 "The strait at the mouth of the Red Sea is the key to our eastern possessions. A permanent naval presence there will protect our merchants, guard the passage of pilgrims and soldiers, and ensure that no foreign power can close the gates between the Mediterranean and the Indian Ocean."
 koj_somalia_title:0 "Conquer Somalia"
 koj_somalia_desc:0 "The Horn of Africa has become an essential link between the Nile, Arabia, and the Indian Ocean. By conquering the Somali coast and its inland approaches, we can secure the southern flank of our empire and gain access to the rich ports and incense trade of East Africa."
 koj_crusader_piracy_title:0 "Crusade Somali Pirates"
 koj_crusader_piracy_desc:0 "Pirates operating from the Somali coast threaten the merchants who carry the wealth of our eastern dominions. A kingdom built upon crusading ideals cannot tolerate such a challenge indefinitely. We shall bring the pirates to heel and make the sea lanes safe once more."
 koj_hospitallars_title:0 "Restore the Hospitallers"
 koj_hospitallars_desc:0 "The Knights Hospitaller remain one of the great military traditions of Christendom. By recovering their stronghold and restoring their place in the Kingdom, we can once again employ an order devoted to defending the faith and carry our claims toward the lands of the old Crusader frontier."
 koj_establish_merchant_escorts_title:0 "Merchant Escorts"
 koj_establish_merchant_escorts_desc:0 "Our merchants travel farther with every passing year, but distance brings danger. Establishing dedicated naval escorts and fortified coastal stations will protect the trading fleets that connect Egypt, Arabia, and the Indian Ocean with our ports."
 koj_alexandrian_trade_title:0 "Alexandrian Trade"
 koj_alexandrian_trade_desc:0 "Alexandria was once the great marketplace between the Mediterranean and the East. Its harbors and markets must be restored to their former importance, while the surrounding Nile ports are developed into a single commercial network under the protection of the Crown."
 koj_cultivate_the_delta_title:0 "Cultivate the Delta"
 koj_cultivate_the_delta_desc:0 "The Nile Delta is among the most fertile regions in the world, yet its riches depend upon constant cultivation and careful management. We must invest in its towns and fields so that the Delta can sustain both our growing population and the ambitions of our expanding empire."
 koj_father_african_rivers_title:0 "Father of African Rivers"
 koj_father_african_rivers_desc:0 "The rivers of Egypt are more than borders and waterways; they are the arteries of our African realm. By improving the lands along the Nile and organizing the transport of goods upon it, we can turn the river into a source of lasting prosperity for the Crown."
 koj_aden_trade_title:0 "Presence in Aden"
 koj_aden_trade_desc:0 "Aden is the natural meeting point of the trade routes of Africa, Arabia, and India. Securing its markets and commanding the surrounding trade will allow us to connect our eastern possessions into a coherent commercial system and keep foreign merchants from taking the lion's share of its wealth."
 koj_mediterranean_breadbasket_title:0 "Mediterranean Breadbasket"
 koj_mediterranean_breadbasket_desc:0 "A powerful kingdom requires a dependable supply of food, and Egypt is uniquely suited to provide it. By strengthening state control over the Delta and investing in grain production, we can make the Nile valley the breadbasket that feeds our Mediterranean dominions."
 koj_church_charity_title:0 "Charity of the Mother Church"
 koj_church_charity_desc:0 "Prosperity carries obligations as well as privileges. The Church must have the means to care for the poor, maintain charitable institutions, and support communities in need. By funding these works, the Crown can turn Egypt's wealth into a lasting expression of Christian charity."
 koj_egyptian_administration_title:0 "Egyptian Administration"
 koj_egyptian_administration_desc:0 "Egypt is too wealthy and too important to be governed by improvised arrangements. We must develop a disciplined administration capable of collecting revenue, keeping autonomy in check, and managing our territories and subjects without allowing the machinery of government to become a burden of its own."
 koj_ecclesiastical_schools_title:0 "Ecclesiastical Schools"
 koj_ecclesiastical_schools_desc:0 "A kingdom restored in the name of Christ must also be a kingdom of learning. Ecclesiastical schools can educate clergy, administrators, and scholars alike, preserving knowledge and providing the intellectual foundations for a more capable and united realm."
 koj_cairo_expansion_title:0 "Expansion of Cairo"
 koj_cairo_expansion_desc:0 "Cairo is the greatest city of the Nile and the natural seat of power in Egypt. Its streets, markets, and public works must be expanded until the capital reflects the wealth and ambition of the Kingdom, drawing commerce and people toward its walls."
 koj_karimi_merchants_title:0 "Karimi Merchants"
 koj_karimi_merchants_desc:0 "The Karimi merchants once connected Egypt with the ports and markets of the Indian Ocean through an extensive network of long-distance trade. By empowering these merchant houses and concentrating the spice trade in Alexandria and Cairo, we can revive that commercial tradition under our protection."
 koj_center_of_middle_east_title:0 "Center of the Middle East"
 koj_center_of_middle_east_desc:0 "Our realm now spans the crossroads of Africa, Arabia, and the Levant. Military conquest has brought these lands together, but only a common political order can keep them united. We must integrate the peoples and territories of the Middle East into a single, enduring center of power."
 koj_colonize_spice_islands_title:0 "Reach the Spice Islands"
 koj_colonize_spice_islands_desc:0 "The richest spices of the East grow far beyond the Red Sea, in islands whose names are still unknown to many in the Mediterranean. Our merchants must follow the sea routes eastward and establish a presence in the Spice Islands, bringing their coveted harvests into our sphere."
 koj_harness_spice_trade_title:0 "Harness the Spice Trade"
 koj_harness_spice_trade_desc:0 "The spice trade can enrich any power that controls its sources and the routes between them. We must send expeditions into distant waters and ensure that foreign merchants do not monopolize the cloves that pass through our eastern markets."
 koj_great_power_title:0 "Imperial Gambit"
 koj_great_power_desc:0 "The Kingdom of Jerusalem was born as a frontier state, but our dominion has long since outgrown that role. With wealth, territory, and influence stretching from the Mediterranean to the Indian Ocean, we must seize the imperial opportunity before us and take our place among the greatest powers of the world."
 somali_piracy_tt:0 "The country or its non-tributary subjects owns at least 10 costal provinces in the Somali region"
