l_english:
 OUT: "Tramor"
 # Custom Tooltips
 FRABRI_Constable_trigger_tt: "At least one allied country has the §YHonored Alliance§! opinion of us and does NOT have the §YSeparate Peace§! opinion."
 FRABRI_extra_reward_tt: "If any country has the §YFought to the End§! opinion of us:"
 FRABRI_add_base_tax_tt: "Our §Y3§! most developed provinces that have a tax building gain §G2§! Base Tax."
 FRABRI_Improved_religious_culture_tt: "Greatly improves our religious culture and administrative ties with the clergy."
 FRABRI_extra_curia_if_catholic_tt: "If our religion is §YCatholic§!:"
 FRABRI_extra_reward_when_colonialism_tt: "Grants a special bonus during the §YAge of Reformation§!:"

 # Events (flavor_FRABRI)
 flavor_FRABRI.1.t: "The Inheritance of Rennes"
 flavor_FRABRI.1.d: "The dynastic ties between the noble houses of Galia and the Iberian crowns run deep. With the shifting balance of power in the Mediterranean, ancient documents and genealogies have been brought to the court, proving our rightful claim to the lands of Aragon and Catalonia. Our ancestors forged these alliances, and now it is time to press these claims to bring the Iberian realms into our fold."
 flavor_FRABRI.1.a: "Let us claim what is rightfully Ours!"
 flavor_FRABRI.1.b: "Let us drop our claims for good."

 # ==============================================
 # The Holy Lands of Yemen (flavor_FRABRI.2)
 # ==============================================
 flavor_FRABRI.2.t: "The Holy Lands of Yemen"
 flavor_FRABRI.2.d: "Our relentless expansion and crusading fervor have brought the strategic lands of Yemen under our direct control. As the undisputed shield of Christendom, we now face the challenge of administering these distant, hostile territories. The clergy and the pious nobility have proposed a grand vision: the establishment of a new Crusader State centered in Aden. By relinquishing direct control and installing a holy order to govern these lands, we could secure the Red Sea, protect Christian pilgrims, and project our righteous fury deep into the Arabian Peninsula. Alternatively, our sovereign could maintain direct military rule over the region."
 flavor_FRABRI.2.a: "Establish the Crusader State of Aden."
 flavor_FRABRI.2.b: "We shall rule these lands directly by the sword!"

 # ==============================================
 # The Habsburg Ring / The Imperial Question (flavor_FRABRI.3)
 # ==============================================
 flavor_FRABRI.3.t: "The Imperial Question"
 flavor_FRABRI.3.d: "For centuries, the Holy Roman Empire has stood as a sprawling, convoluted bulwark on our eastern borders. Claiming the ancient mantle of Rome, its emperors have constantly sought to encircle, isolate, and undermine our great nation. However, with our recent triumphs, the balance of power in Europe has shifted irrevocably in our favor. The time has come to definitively settle the 'Imperial Question'. Shall we claim the legendary legacy of Charlemagne and bend the German electors to our sovereign will, or shall we march east with fire and sword to shatter their archaic institution once and for all?"
 flavor_FRABRI.3.a: "We are the true heirs of Charlemagne. The Empire is ours!"
 flavor_FRABRI.3.b: "The Empire is an archaic abomination. We shall dismantle it!"
 flavor_FRABRI.3.c: "The Habsburg ring is broken. Their Empire is no more."
 flavor_FRABRI.3.e: "Let us reconsider our approach to the Empire."

 # Modifiers
 FRABRI_Constable: "Office of the Constable"
 desc_FRABRI_Constable: "The Constable oversees our military organization, ensuring that our armies are disciplined and led with superior tactical brilliance."

 FRABRI_accumulating_military_experience: "Accumulating Military Experience"
 desc_FRABRI_accumulating_military_experience: "Our loyal allies fighting alongside us to the bitter end has provided our commanding officers with invaluable battlefield experience, strengthening our martial traditions."

 FRABRI_Master_Bordeaux: "Masters of the Gironde"
 desc_FRABRI_Master_Bordeaux: "By dominating the trade hubs of Bordeaux and securing the local markets, our merchants maintain a powerful and lucrative grip on the regional commerce."

 FRABRI_Theological_Universities: "Theological Universities"
 desc_FRABRI_Theological_Universities: "The establishment of dedicated theological centers has fostered a deeper connection with the Church, improving clerical loyalty while curbing their undue political influence."

 FRABRI_Colonial_Port: "Brest Colonial Hub"
 desc_FRABRI_Colonial_Port: "Our expanded dockyards in Brest serve as the perfect staging ground for colonial ventures across the perilous Atlantic."

 FRABRI_entrepot_nantes: "Entrepôt of Nantes"
 desc_FRABRI_entrepot_nantes: "The thriving port of Nantes acts as a massive commercial hub, drawing in wealth and magnifying our control over Atlantic trade routes."
