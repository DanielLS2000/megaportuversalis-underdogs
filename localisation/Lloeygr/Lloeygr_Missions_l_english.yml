l_english:
 underdog_eng_early_industry_sco_title:0 " Central Belt Coal Mining"
 underdog_eng_early_industry_sco_desc:0 "We have struck coal in Ayrshire! While its value may seem questionable now, this mundane-looking substance will surely fuel a new era in technology. We must prepare for this industrial revolution."
 underdog_eng_college_of_justice_title:0 "College of Justice"
 underdog_eng_college_of_justice_desc:0 "Scotland lacks a comprehensive, universal justice system. We should ensure that all Scots are ruled by the same laws through a single centralized institution."
 underdog_eng_import_potatoes_copy_3_title:0 "Import Potatoes"
 underdog_eng_import_potatoes_copy_3_desc:0 "We have discovered a curious tuber in the New World. Having given up on attempts to smoke it, we have learned that it would make an ideal staple crop to grow back home in Ireland. Even small families would be able to easily grow enough to survive."
 underdog_eng_rule_britannia_ire_title:0 "Rule Britannia"
 underdog_eng_rule_britannia_ire_desc:0 "All the British Isles shall be our domain. We will rule Britannia."
 underdog_eng_recruit_the_mercenaries_title:0 "Raise an Army"
 underdog_eng_recruit_the_mercenaries_desc:0 "Traditionally, the Parliament opposes any attempt of a standing army for the royal house. Instead, our [Root.GovernmentName] relies on the effort of militia, mercenaries and the levies of the Nobility. As the Hundred Years' War is going through its last phases and the Scots are posing a threat to our security, it is only natural that we must raise an army one way or another."
 underdog_eng_conquer_scotland_title:0 "Subjugate Scotland"
 underdog_eng_conquer_scotland_desc:0 "Edward I, Scottorum Malleus, saw the wisdom of securing our kingdom by subjugating the Scots. We must do the same."
 underdog_eng_irish_conquest_title:0 " Conquer Ireland"
 underdog_eng_irish_conquest_desc:0 "Historically known as 'His Majesty's Irish Enemies', the Gaelic populace of Ireland have long been outside English rule. It is time they were brought to heel."
 underdog_eng_unify_the_isles_title:0 "Unify the Isles"
 underdog_eng_unify_the_isles_desc:0 "The British Isles are home to the two kingdoms of England and Scotland as well as the many petty realms of Ireland. It is up to us to unify the isles under the English rule."
 underdog_eng_act_of_union_title:0 " The Acts of Union"
 underdog_eng_act_of_union_desc:0 "The legislation of the many kingdoms of the Isles is separated and convoluted. Although each of these states share the same monarch, their laws and parliaments are not unified under a single constitution. We cannot let this continue."
 underdog_eng_the_royal_court_title:0 "The Royal Court"
 underdog_eng_the_royal_court_desc:0 "A [Root.Monarch.GetTitle] is nothing without [Root.Monarch.GetHerHis] advisors. No matter how the future of [Root.GetUsableName] will look like, competent consultants are always required."
 underdog_eng_hundred_years_war_title:0 "The Hundred Years' War"
 underdog_eng_hundred_years_war_desc:0 "The Treaty of Tours has brought an uneasy period of truce between [Root.GetName] and France. Both sides are aware that this is unlikely to last, and we must decide whether to honor their treaty and bide our time, or prepare for war. The fate of [Root.GetUsableName] depends on this very action."
 underdog_eng_handle_the_reformation_title:0 "Handle the Reformation"
 underdog_eng_handle_the_reformation_desc:0 "Religious anarchy has gripped Europe. Where once the Pope used to be the guidance there is now only chaos. We must take control of the situation, and decide where we stand on the matter of the Divine."
 underdog_eng_piety_of_the_state_title:0 "Piety of the State"
 underdog_eng_piety_of_the_state_desc:0 "We are a land blessed by the Lord himself. But the clerical institutions have a wildly different idea how the religious matters are handled. We must secure the piety of the state and assume control over the church."
 underdog_eng_strengthen_the_monarchy_title:0 "Strengthen the [Root.GovernmentName]"
 underdog_eng_strengthen_the_monarchy_desc:0 "The authority of the crown has always been a subject of contention. While the ruler sees his reign as absolute and of divine nature, the Parliament tries to limit the [Root.Monarch.GetTitle]'s power. As the idea of Absolutism grows in the courts of Europe so does it in ours. We must follow the trend and strengthen the [Root.GetAdjective] [Root.GovernmentName]."
 underdog_eng_end_the_french_conflict_title:0 "End the French Conflict"
 underdog_eng_end_the_french_conflict_desc:0 "Be it through victory over the French and claiming their throne, or by abandoning continental Europe and taking a bigger a focus on the navy: our conflict with France and the continent must find an end one way or another."
 underdog_eng_english_superiority_title:0 "[Root.GetAdjective] Superiority"
 underdog_eng_english_superiority_desc:0 "Our rivals are many and powerful, but also arrogant. They assume they can compete with us on the sea, contest our claim in foreign lands and pose a threat to us. We must show them how fatally wrong they are."
 underdog_eng_develop_british_identity_title:0 "Develop British Identity"
 underdog_eng_develop_british_identity_desc:0 "The British Isles are home to many different cultures and languages. The Scottish and the Highlanders in the North, the Irish of the emerald island and the Welsh and English in the South. Naturally, such collection of different cultures will lead to problems if left untended. We shall forge a British Identity in order to establish a British hegemony over the isles."
 underdog_eng_take_over_the_lowlands_title:0 "Influence the Lowlands"
 underdog_eng_take_over_the_lowlands_desc:0 "The Dutch and the Flemish of the Lowlands are in many ways similar to us: they seek wealth from profitable trade, maintain an impressive naval force and are opposed to French and Spanish dominance. Influencing the Lowlands in our favor might bring us an invaluable ally or subject in this region."
 underdog_eng_allies_on_the_mainland_title:0 "Mainland Alliances"
 underdog_eng_allies_on_the_mainland_desc:0 "Although our priorities lie beyond the sea, we should not forget the threat our home continent could pose to us if left unattended. We should establish alliances with the enemies of our enemies."
 underdog_eng_abolish_villeinage_title:0 " Abolish Villeinage"
 underdog_eng_abolish_villeinage_desc:0 "The villein labor service has proven its worth in the past. However, it is outdated. No longer adequate for a [Root.GovernmentName] of our prestige, it is time to replace this system by promoting copyhold tenure."
 underdog_eng_the_royal_charter_title:0 "Issue the Royal Warrant"
 underdog_eng_the_royal_charter_desc:0 "The royal warrants of appointment is an issue granted to merchants of magnificent goods for the royal court and the royal personages. We should choose our trade partners wisely and grant them these warrants in exchange for a favorable trade."
 underdog_eng_establish_royal_navy_title:0 "Found the Royal Navy"
 underdog_eng_establish_royal_navy_desc:0 "Our current navy is nothing but the levy contribution of our burghers. Mobilization of our the fleet is slow and expensive.\nWe must create a standing navy which defends our island from foreign invaders and secures the future of [Root.GetUsableName]."
 underdog_eng_rule_britannia_gbr_title:0 "Rule Britannia!"
 underdog_eng_rule_britannia_gbr_desc:0 "The navy is our strength; the sea is our home. It is our destiny to rule the world from our isles and dominate it with our naval superiority!"
 underdog_eng_sail_around_africa_title:0 "Sail around Africa"
 underdog_eng_sail_around_africa_desc:0 "What wonders will await us beyond the Cape of Good Hope?"
 underdog_eng_seize_the_cape_title:0 "Seize the Cape"
 underdog_eng_seize_the_cape_desc:0 "The Cape of Good Hope is a crucial waypoint on the route to the East Indies. Without a doubt, who controls the Cape also controls the Asian ambitions of the other great powers. The Cape must be ours!"
 underdog_eng_chart_the_southern_sea_title:0 "Chart the Southern Seas"
 underdog_eng_chart_the_southern_sea_desc:0 "Daring men, with true British grit, are seeking government support to chart the vast empty expanses of the southern oceans. Rumors tell of land there for the taking; we should make haste to establish a thriving colony, before others seize the opportunity."
 underdog_eng_colonize_the_spice_isles_title:0 "Colonize Spice Islands"
 underdog_eng_colonize_the_spice_isles_desc:0 "The farthest reaches of the world produce wondrous spices, woven garments and exotic women. We should establish a presence here, for the benefit of [Root.GetAdjective] society."
 underdog_eng_discover_india_title:0 "Discover India"
 underdog_eng_discover_india_desc:0 "Trade with India has been continuing since time immemorial, but with the long routes, others are profiting from this. We must outfit an expedition and find a sea route to India."
 underdog_eng_english_parliamentarism_title:0 "Acts of the Parliament"
 underdog_eng_english_parliamentarism_desc:0 "The Parliament is a tool of the state. As powerful as any tool can be, the potential of the Parliament can only be utilized properly if it is guided wisely."
 underdog_eng_explore_new_world_title:0 "Discover the Americas"
 underdog_eng_explore_new_world_desc:0 "Hushed whispers tell of mysterious lands to the far West, ripe for growth, and filled with unimaginable wonders. If this is true, they must be ours."
 underdog_eng_colonize_canada_title:0 " Colonize Canada"
 underdog_eng_colonize_canada_desc:0 "Colder and harsher than the southerly lands, the territory of Canada is, nevertheless, ripe for exploitation. Exotic furs, wood and minerals are abundant in the snowy mountains."
 underdog_eng_colonize_north_america_title:0 "Settle in America"
 underdog_eng_colonize_north_america_desc:0 "The lands of America seem suitable for many things. In the north we have heard talk of furs and shipbuilding materials. In the South the land looks suitable for growing many crops. We must establish bases there so we can profit."
 underdog_eng_dominiate_new_world_title:0 "Dominate the New World"
 underdog_eng_dominiate_new_world_desc:0 "This strange New World is [Root.GetAdjective] claim. All of its resources and land belong to the [Root.GetAdjective] crown. We shall ensure our dominance over the New World and expel those who dare to contest us."
 underdog_eng_establish_first_indian_trade_post_title:0 "East Indies Company"
 underdog_eng_establish_first_indian_trade_post_desc:0 "Many exotic goods have their origin in the Indian subcontinent. The European powers have been benefiting from the trade with India for many years by now. It is time for us to get on equal footing with them and establish our own trade company in India."
 underdog_eng_seize_ceylon_title:0 "Seize Ceylon"
 underdog_eng_seize_ceylon_desc:0 "Ceylon is an island near India which is of great use in securing the trade in the Indian Ocean. Our rivals are aware of the profitable trade with India and the spice isles, and seek Ceylon's occupation of their own. We must not allow this to happen."
 underdog_eng_conquer_western_india_title:0 "Take West Indian Coast"
 underdog_eng_conquer_western_india_desc:0 "Undeniably, control over the seafront along the West Indian Coast would give us greater control over India as a whole. Take this land in the name of [Root.GetName]."
 underdog_eng_conquer_inland_india_title:0 " Push into Inland India"
 underdog_eng_conquer_inland_india_desc:0 "The inland territories of India are renowned for their lucrative mines and rare jewels. Needless to say, the native inhabitants of the region would be much better off under our administration."
 underdog_eng_conquer_eastern_india_title:0 "Conquer Bengal"
 underdog_eng_conquer_eastern_india_desc:0 "The [Root.GetAdjective] East Indian Trading Company has been operating in this region for some time. By their request, and with their guidance, it is time to solidify our hold on the fertile Bengal Delta."
 underdog_eng_masters_of_india_title:0 " Masters of India"
 underdog_eng_masters_of_india_desc:0 "The Indian subcontinent bows before the might of the [Root.GetAdjective] [Root.GovernmentName]. Let us harvest the spoils of India for the glory of [Root.GetUsableName]!"
 underdog_eng_a_house_divided_title:0 "A House Divided"
 underdog_eng_a_house_divided_desc:0 "The great Parliament is split into two houses: the House of Commons, which is the voice of the taxpayers, the commoners and burghers, and the House of Lords, the political body for the nobility and clergy. We must ensure the loyalty of both houses."
 underdog_eng_monopolize_the_channel_title:0 "Monopolize the Channel"
 underdog_eng_monopolize_the_channel_desc:0 "Now that we have clearly established our colonial dominance, valuable wares have started arriving from the colonies. Whatever flows through the Channel is rightfully ours, and we must protect our investments abroad and at home."
 underdog_eng_center_of_worlds_trade_title:0 "Centers of World's Trade"
 underdog_eng_center_of_worlds_trade_desc:0 "Wherever our gaze falls upon, there shall be commerce of inconceivable wealth. Our marketplaces are the centers of the trade of the world."
 underdog_eng_early_industry_gbr_title:0 "Early Industry"
 underdog_eng_early_industry_gbr_desc:0 "As our vast industrial holdings grow, demand for fuel grows ever higher as mechanized industry takes shape around [Root.GetName]. Increase the supply of refined materials."
 underdog_eng_english_renaissance_title:0 "[Root.GetAdjective] Renaissance"
 underdog_eng_english_renaissance_desc:0 "State, army, trade and diplomacy are subjects to change and evolution, and culture is no exception to it. We shall embrace and promote the ideas of the Renaissance."
 underdog_eng_renovate_universities_title:0 "Renovate Oxbridge"
 underdog_eng_renovate_universities_desc:0 "The facilities at the centuries old universities of Oxford and Cambridge are beginning to prove unfit for purpose. A small investment should improve matters considerably."
 underdog_eng_the_men_of_war_title:0 "Expand the Royal Navy"
 underdog_eng_the_men_of_war_desc:0 "We live and die by our ability to project our power over the sea. We must prepare our nation for the construction and expansion of the Royal Navy."
 underdog_eng_the_royal_marines_title:0 "The Royal Marines"
 underdog_eng_the_royal_marines_desc:0 "The maritime nature of our state demands adaptations of our military. We must establish the Royal Marines which shall protect the interests of [Root.GetUsableName] overseas."
 underdog_eng_create_standing_army_title:0 "Found a Standing Army"
 underdog_eng_create_standing_army_desc:0 "Although the Parliament sees this act with suspicion and fear, the recent wars as well as the threat of the Civil War have shown the need for a standing army under the command of the [Root.Monarch.GetTitle]. We cannot let [Root.GetUsableName] be left unprotected in case of an enemy invasion."
 underdog_eng_the_redcoats_title:0 "The Redcoats"
 underdog_eng_the_redcoats_desc:0 "In the turmoil of the battle, troops can lose their orientation quickly and find themselves shooting on allies and comrades on accident. Such incidents must be avoided at all cost. Establishing a proper uniform for our troops which makes them strikingly visible will reduce the number of such accidents significantly while also improving the look of our army."
 underdog_eng_the_english_civil_war_title:0 "The Three Kingdoms Wars"
 underdog_eng_the_english_civil_war_desc:0 "The rule of the [Root.Monarch.GetTitle] and the power of the Parliament are in stark contrast. Conflict between the Royalists and the Parliamentarians is inevitable.\nWe must make sure that [Root.GetUsableName] will prevail these trying times and come forth as a state of greater power and authority."