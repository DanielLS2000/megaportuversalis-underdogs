l_english:
 abimcao_de_tigranes_title:0 "Ambition of Tigranes II"
 abimcao_de_tigranes_desc:0 "In Antiquity, the heir to Tigranes the Great, Tigranes II, declared war against the Greek lords of Anatolia and annexed them to his empire. However, his greatest ambition was not merely to conquer their territories, but also to integrate the Greek peoples who lived there into the Armenian Empire, making them Armenian citizens."
 acabando_com_os_persas_title:0 "Finishing the Persians"
 acabando_com_os_persas_desc:0 "After the great victory against the Greek lords, Tachat II gained incredible confidence in the quality of his army and decided to continue advancing upon those who had once been his tormentors."
 aproveitando_as_brechas_title:0 "Seizing the Opportunities"
 aproveitando_as_brechas_desc:0 "After nearly a century of peace and internal development, the Empire of Greater Armenia, led by Tachat the Builder and his descendants, finally found an opportunity to expand.\n\nEven as the most powerful country in Europe, Tachat's descendants feared a war against the Eastern Roman Empire and the Persians — not because they believed they couldn't win, but because of the humanitarian costs it could bring.\n\nTaking advantage of the great civil war that erupted in the Eastern Roman Empire in 1444, resulting in its dissolution, we decided to invade it and thus fulfill the dream of our ancestors."
 a_conquista_romana_title:0 "Conquest of Byzantium"
 a_conquista_romana_desc:0 "After successfully integrating the conquered Greek territories and their Greek citizens into our country, we realized that we could continue advancing and prevent the Eastern Roman Empire from rising again."
 quebrando_os_romanos_title:0 "Breaking the Romans"
 quebrando_os_romanos_desc:0 "After conquering all of Anatolia, which for over 1,000 years was the economic center of the Eastern Romans, we have left the former empire impoverished and even more divided. Now, we must continue advancing and claim the throne they have left empty."
 conquista_da_mesopotamia_title:0 "Conquest of Mesopotamia"
 conquista_da_mesopotamia_desc:0 "Mesopotamia has always had immense food production, since the times of the ancient Greater Armenia. Possessing it would end a problem that has always existed in the Caucasus, but which, with the development of the region, has become even more evident: the lack of agricultural production."
 cristianizando_o_leste_title:0 "Christianizing the East"
 cristianizando_o_leste_desc:0 "With our rapid expansion, we ended up conquering many pagan territories. We shall found a center for the mass conversion of these peoples."
 a_grande_livraria_title:0 "The Great Library"
 a_grande_livraria_desc:0 "After the conquest of the Islamic city of Baghdad, we managed to gain control of the great library. However, many of the books are in terrible condition, while others are nearly beyond repair. We will need a king wise enough, or an excellent advisor, to restore them."
 reconstruindo_a_persia_title:0 "Rebuilding Persia"
 reconstruindo_a_persia_desc:0 "After the conquest of the Islamic territories, we realized that nearly 300 uninterrupted years of wars in the region have completely compromised the infrastructure of even the richest cities. We will have to rebuild them."
 capital_persa_title:0 "Persian Capital"
 capital_persa_desc:0 "To better control the Greater Persia region, Tachat II and his descendants decided to create a sort of administrative center in Persia. The chosen location was the former capital of the Ilkhanate, Tabriz. However, for it to serve as our administrative center, we must return it to its former glory."
 berco_da_civilizacao_title:0 "Cradle of Civilization"
 berco_da_civilizacao_desc:0 "After conquering the fertile areas of the Euphrates and Tigris rivers, we realized that decades of Mongol invasions and local wars between Islamic lords have severely damaged the river canals, affecting food cultivation. We will have to fix this."
 conquista_de_isfaham_title:0 "Conquest of Isfahan"
 conquista_de_isfaham_desc:0 "After centuries of defeats, humiliations, and subjugation, we have finally managed to fulfill the dream of Tigranes the Great and completely conquer Persia."
 desenvolvendo_a_persia_title:0 "Developing Persia"
 desenvolvendo_a_persia_desc:0 "After establishing a great administrative center in Persia, we have decided to elevate the region to its former glory."
 o_problema_recente_title:0 "The Question of Jerusalem"
 o_problema_recente_desc:0 "After centuries of good relations, we do not know if we can remain allied with our Catholic neighbor; their newly conquered lands make us think twice if it is prudent to have such a strong country on our border."
 indo_ate_o_final_title:0 "Going to the End"
 indo_ate_o_final_desc:0 "After conquering the Capital of Jerusalem, all that remains is for us to keep advancing.\n"
 conquista_da_grecia_title:0 "Conquering Greece"
 conquista_da_grecia_desc:0 "Advancing after conquering the former capital of the glorious Eastern Roman Empire, we must continue our offensives in order to consolidate our position."
 o_celeiro_do_mediterraneo_title:0 "Granary of the Mediterranean"
 o_celeiro_do_mediterraneo_desc:0 "Our conquests have brought vast tracts of fertile land under our control. We must ensure these regions are optimized to feed our growing empire and solidify our status as the dominant agricultural power in the Mediterranean."
 reconstrucao_de_constantinopla_title:0 "Rebuilding Constantinople"
 reconstrucao_de_constantinopla_desc:0 "After the war for the conquest of Constantinople, we unfortunately damaged the entire structure of the city and will have to repair it."
 reconstruindo_tbilisi_title:0 "Rebuilding Tbilisi"
 reconstruindo_tbilisi_desc:0 "After the foundation of the dye industry in Tbilisi, it became an important economic center for the country. However, the production techniques and infrastructure for such are still very backward/underdeveloped compared to those of our neighbors. We must change this!\n"
 reconstruindo_tigranakert_title:0 "Rebuilding Tigranakert"
 reconstruindo_tigranakert_desc:0 "Tigranakert, named after our illustrious King Tigranes the Great, was once a jewel of Armenian culture and power, the embodiment of our golden age. However, the marks of time and conflicts have left this once-prosperous city in ruins. The legacy of our ancestors calls to us from these stones, begging us to restore Tigranakert to its former glory.\n"
 vinhedos_caucasianos_title:0 "Caucasian Vineyards"
 vinhedos_caucasianos_desc:0 "The winemaking tradition of the Caucasus has deep historical roots, dating back centuries, if not millennia. As wine is one of our most vital products, it is important that we strive to gain global recognition and appreciation for it."
 reasentando_as_terras_antigas_title:0 "Resettling the Ancient Lands"
 reasentando_as_terras_antigas_desc:0 "Over the centuries, Armenians have dispersed across the globe, forming a rich and vibrant diaspora. Yet, the call of the homeland resonates in every Armenian heart, no matter how distant. The time has come for our diaspora to unite and repopulate our ancestral lands. Reclaiming and repopulating these regions is more than a geopolitical strategy; it is a journey towards cultural rebirth, a beacon of hope for all Armenians, and a testament to our unity and resilience.\n"
 modernizando_o_nosso_alfabeto_title:0 "Modernizing Our Alphabet"
 modernizando_o_nosso_alfabeto_desc:0 "After conquering numerous peoples, to facilitate their assimilation into our rich literature, culture, and history, we will better standardize and incorporate certain aspects of Greek and Persian literature and writing."
 fortifique_o_caucaso_title:0 "Fortifying the Caucasus"
 fortifique_o_caucaso_desc:0 "\nOur lands have been repeatedly threatened by pagan expansion, barbarian fury, and illegitimate foreign conquest. Now more than ever, we must transform the mountainous dwellings of our docile peasantry into recruitment centers and castle complexes. The bones of every reckless conqueror will be reduced to dust against our sacred peaks."
 legado_do_construtor_title:0 "Legacy of the Builder"
 legado_do_construtor_desc:0 "Under the reign of King Tachat, known as \"the Builder\", Armenia flourished in a golden age. Let us draw inspiration from his remarkable legacy and work to bestow upon our cities fame, wealth, and relevance."
 a_crescente_fertil_title:0 "The Fertile Crescent"
 a_crescente_fertil_desc:0 "By controlling the cradle of civilization, we must harness its agricultural potential. Expanding irrigation networks and modernizing farming techniques will ensure endless prosperity."
 reasentando_as_terras_da_cilicia_title:0 "Cilician Repopulation"
 reasentando_as_terras_da_cilicia_desc:0 "After the conquest of the Cilicia area, we noticed that a large part of the region had become Greek. We must bring our customs and our population here so this region can become what it once was."
 tecnologias_gregas_de_cultivo_title:0 "Greek Technologies"
 tecnologias_gregas_de_cultivo_desc:0 "After the conquest of Anatolia, we discovered more efficient ways of planting and livestock farming; however, to utilize them, we will have to improve our infrastructure."
 domine_o_mar_nego_title:0 "Dominate the Black Sea"
 domine_o_mar_nego_desc:0 "Our successful campaigns against the Tatars have resulted in the incorporation of most of the Black Sea coast into our domain. Our next step is to consolidate our governance over this maritime territory and leverage it effectively for trade with the Greeks and the Balkans."
 reestaurar_nikopolis_title:0 "Restore Nikopolis"
 reestaurar_nikopolis_desc:0 "We need a commercial center to manage our trade in Anatolia, and for this, we have decided to choose Nicopolis, once the capital of a great Roman Empire. However, the city is currently desolate from conflicts and outdated in terms of infrastructure. If we want this to be our commercial center in the region, we will have to fix that."
 o_sistema_de_ayrudzi_title:0 "The Ayrudzi System"
 o_sistema_de_ayrudzi_desc:0 "To field an army capable of conquering the known world, we must formalize our elite cavalry traditions. The Ayrudzi system will ensure we always have the finest mounted warriors at our disposal."
 criar_a_marinha_armena_title:0 "Found the Armenian Navy"
 criar_a_marinha_armena_desc:0 "To protect our coastal acquisitions and project power across the Mediterranean and Black seas, we must build a formidable fleet worthy of our empire."
 dominando_o_fogo_grego_title:0 "Mastering Greek Fire"
 dominando_o_fogo_grego_desc:0 "With the fall of the Romans, the secrets of Greek Fire are now ours to exploit. We must study and weaponize this devastating incendiary compound."
 controle_os_vassalos_title:0 "Control the Vassals"
 controle_os_vassalos_desc:0 "Our expanding empire includes many subjugated lords. We must implement strict administrative controls to ensure their unwavering loyalty to the crown."
 refine_os_sooseramartik_title:0 "Refine the Sooseramartik"
 refine_os_sooseramartik_desc:0 "Our traditional infantry must evolve. By drilling our Sooseramartik soldiers in modern tactics, they will become an unstoppable force on the battlefield."
 reformando_o_sistema_militar_title:0 "Reforming the Military System"
 reformando_o_sistema_militar_desc:0 "A vast empire requires a professional standing army. We must overhaul our recruitment and logistical networks to maintain an invincible military machine."
 envie_uma_carta_para_o_tsar_title:0 "Send a Letter to the Tsar"
 envie_uma_carta_para_o_tsar_desc:0 "The rising power of the Russians presents both a threat and an opportunity. A diplomatic overture to the Tsar could secure our northern borders."
 proclamacao_da_grande_armenia_title:0 "Greater Armenia"
 proclamacao_da_grande_armenia_desc:0 "Our great nation has come a long way, standing firm against formidable adversaries, recovering lands of religious importance, and restoring the prominence of our faith. However, one mission still calls to us, one that will bring us closer to our ancestral roots and promise a new era of prosperity: the reconquest of our ancestral lands. The provinces lost in past centuries are not merely territories; they are the heart and soul of our Armenian identity. Only by uniting these lands under our rule can we truly claim that Armenia has been restored to its former glory. The journey will be fraught with challenges, but once completed, we will be able to stand tall with pride and proclaim the advent of Greater Armenia, marking the beginning of a new Golden Age.\n"
 Subsidio_Mercantil_Armeno_title:0 "Merchant Subsidy"
 Subsidio_Mercantil_Armeno_desc:0 "By financially backing our merchants and trading guilds, we can ensure that Armenian commerce reaches the farthest corners of the world."
 mordenizacao_dos_mercadores_armenos_title:0 "Modernization of Merchants"
 mordenizacao_dos_mercadores_armenos_desc:0 "Trade practices evolve rapidly. We must reform our merchant companies to utilize the latest accounting and navigational techniques."
 coletando_os_nossos_lucros_title:0 "Collecting Our Profits"
 coletando_os_nossos_lucros_desc:0 "With our trade network spanning continents, we must aggressively enforce our monopolies and tariffs to fill the royal treasury."
 reconstruindo_a_macedonia_title:0 "Rebuilding Macedonia"
 reconstruindo_a_macedonia_desc:0 "The ancient lands of Macedonia have suffered greatly through recent conflicts. Restoring its infrastructure will turn it into a vital jewel of our empire."
 cidade_do_desejo_do_mundo_title:0 "City of the World's Desire"
 cidade_do_desejo_do_mundo_desc:0 "Constantinople is once again the center of the known world. We must invest heavily to ensure it outshines every other capital in existence."
 a_megalopole_title:0 "The Megalopolis"
 a_megalopole_desc:0 "Our capital is growing at an unprecedented rate. We must expand its urban limits and construct grand monuments to accommodate our imperial splendor."
 crescimento_das_vidracarias_title:0 "Growth of the Glassworks"
 crescimento_das_vidracarias_desc:0 "The delicate art of glassmaking can bring immense wealth. Subsidizing local artisans will create a booming luxury industry."
 ARM_support_weavers_title:0 "Support the Weavers"
 ARM_support_weavers_desc:0 "The textile industry is the backbone of our domestic economy. We must grant privileges and funds to our weavers to dominate the international cloth market."
 conquista_da_tunisia_title:0 "Conquest of Carthage"
 conquista_da_tunisia_desc:0 "The ancient maritime power of Carthage still holds immense strategic value. Capturing Tunis will cement our naval hegemony in the Mediterranean."
 independencia_economica_title:0 "Economic Independence"
 independencia_economica_desc:0 "We can no longer rely on foreign imports. By developing domestic industries, our empire will become entirely self-sufficient."
 Repovoamento_armeno_na_anatolia_title:0 "Armenian Repopulation"
 Repovoamento_armeno_na_anatolia_desc:0 "The heartlands of Anatolia must reflect our culture. We shall incentivize the mass migration of Armenians to settle these newly conquered lands."
 o_vermelho_real_title:0 "The Royal Red"
 o_vermelho_real_desc:0 "The famous Armenian Cochineal dye is prized across the world. Expanding its production will ensure that the color of royalty is synonymous with our empire."