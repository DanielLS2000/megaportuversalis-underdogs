l_english:
 flavor_armenia.1.t:0 "The Sack of Venice"
 flavor_armenia.1.d:0 "For decades, the merchant republics have exploited the wealth of the East. The Venetians, above all, have been an immense thorn in the side of our imperial ambitions. Now, our victorious forces march through the streets of Venice! We have reclaimed ancient treasures and dismantled their maritime hegemony. The wealth of the Serene Republic is ours for the taking."
 flavor_armenia.1.a:0 "Pillage the city and return our rightful treasures!"
 flavor_armenia.1.b:0 "Instead, we shall take control of their famed Arsenal."

 flavor_armenia.2.t:0 "The Catholicos Declares the Schism Mended"
 flavor_armenia.2.d:0 "With our armies triumphing over the Latin strongholds, the Catholicos of Armenia has stood before the grand altars and officially declared the Great Schism mended on our terms. The authority of the Roman Pope is dissolved, and the true faith shall reign supreme across all of Christendom. However, this bold claim will surely incite fury in the West."
 flavor_armenia.2.a:0 "The true faith triumphs over Rome!"
 flavor_armenia.2.b:0 "We cannot force this issue so violently."

 flavor_armenia.3.t:0 "Dealing with Foreign Aristocrats"
 flavor_armenia.3.d:0 "As our borders expand, we must decide how to handle the entrenched nobility of the lands we have conquered. Some of our generals suggest making a brutal example of them to ensure absolute obedience, while others counsel a more amiable approach to integrate them smoothly into the Armenian administration."
 flavor_armenia.3.a:0 "Crush them without mercy."
 flavor_armenia.3.b:0 "An amiable approach will serve us better."

 flavor_armenia.4.t:0 "The Armenian Diaspora in Italy"
 flavor_armenia.4.d:0 "The ancient Greek enclaves in Italy, long isolated from their homeland, now look to us for protection. By fostering these communities and sending Armenian settlers to join them, we can transform southern Italy into a vital cultural and economic stronghold for our empire."
 flavor_armenia.4.a:0 "Establish our presence in the West."

 flavor_armenia.5.t:0 "The General Tigran"
 flavor_armenia.5.d:0 "A military genius named Tigran has emerged from our ranks, displaying a remarkable grasp of ancient tactics and modern warfare. He asks only to be assigned to the frontline, but we must decide what specialized role suits him best."
 flavor_armenia.5.a:0 "He is an all-around capable leader."
 flavor_armenia.5.b:0 "His mastery lies in the shock of the charge."
 flavor_armenia.5.c:0 "He is a master of sieges."
 flavor_armenia.5.e:0 "His true talent is the volley of fire."

 flavor_armenia.6.t:0 "The Imperial Legacy"
 flavor_armenia.6.d:0 "Our conquests have reached a scale not seen since the days of Tigranes the Great. The clergy and the nobility now urge our monarch to formally proclaim the restoration of the ancient, undivided Imperial legacy, establishing our right to rule over the entirety of the civilized world."
 flavor_armenia.6.a:0 "We are the true heirs to the ancient empires!"

 flavor_armenia.7.t:0 "The Secondary Capital"
 flavor_armenia.7.d:0 "With Rome now firmly in our grasp, the sheer distance between our heartland and our western territories poses a logistical nightmare. Some propose that we establish Rome as a secondary capital to govern the West, while others suggest moving our primary court there entirely."
 flavor_armenia.7.a:0 "Relocate our primary court to Rome!"
 flavor_armenia.7.b:0 "It shall serve as our glorious secondary capital."

 flavor_armenia.8.t:0 "Reversal of Downfall"
 flavor_armenia.8.d:0 "For centuries, the story of our people was one of decline, partition, and subjugation. But no longer! Our stunning military victories have proven to the world that Armenia is not just surviving—it is thriving and reclaiming its rightful place as a global superpower."
 flavor_armenia.8.a:0 "The Armenian Phoenix has risen!"

 flavor_armenia.9.t:0 "Armenian Settlement"
 flavor_armenia.9.d:0 "Through deliberate state policies and the natural migration of our people, the demographics of this province are shifting. The local populace is rapidly adopting the Armenian language, customs, and identity, integrating fully into our cultural sphere."
 flavor_armenia.9.a:0 "Excellent news."

 flavor_armenia.10.t:0 "The Turkish Populace"
 flavor_armenia.10.d:0 "As we consolidate our rule over Anatolia, we must address the vast Turkish population living within our borders. We can either officially accept their culture to ensure peace, heavily incentivize their assimilation, or conscript their youth into specialized imperial guard units."
 flavor_armenia.10.a:0 "Grant them full rights as citizens."
 flavor_armenia.10.b:0 "Focus on cultural assimilation."
 flavor_armenia.10.c:0 "Conscript their finest into the Imperial Guard."

 flavor_armenia.11.t:0 "The Grand Mosque of Mecca"
 flavor_armenia.11.d:0 "Our armies have taken Mecca, the holiest site in Islam. The fate of the Grand Mosque now rests in our hands. We can convert it into a monumental cathedral to symbolize our ultimate triumph, or preserve it to appease our Muslim subjects and maintain stability."
 flavor_armenia.11.a:0 "Convert it into a grand Cathedral!"
 flavor_armenia.11.b:0 "Preserve the Mosque. We are a tolerant empire."

 flavor_armenia.12.t:0 "Securing the Black Sea"
 flavor_armenia.12.d:0 "With the subjugation of the treacherous offshoot states along the coast, our control over the Black Sea trade is absolute. The region's merchants now flock to our centralized ports, enriching our treasury beyond measure."
 flavor_armenia.12.a:0 "Our maritime dominance is secured."

 flavor_armenia.13.t:0 "The Caucasian Gates"
 flavor_armenia.13.d:0 "To protect our heartland from northern incursions, we must fortify the critical mountain passes. Massive stonework and modern bastions will turn the Caucasian Gates into an impenetrable barrier against any invading force."
 flavor_armenia.13.a:0 "Fortify the mountain passes!"
 flavor_armenia.13.b:0 "Focus our engineering efforts on the capital's walls instead."

 flavor_armenia.14.t:0 "The Caucasian Gates Completed"
 flavor_armenia.14.d:0 "Our engineers report that the grand fortifications blocking the mountain passes have been completed. Any enemy attempting to march through will find only death and despair before these massive walls."
 flavor_armenia.14.a:0 "An impenetrable defense."

 flavor_armenia.15.t:0 "The Imperial Walls Upgraded"
 flavor_armenia.15.d:0 "The ancient walls of our capital have been completely modernized. Bristling with artillery emplacements and reinforced bastions, they stand ready to repel the greatest sieges the world has ever seen."
 flavor_armenia.15.a:0 "Our capital is safe."

 flavor_armenia.16.t:0 "The Orthodox Confraternity"
 flavor_armenia.16.d:0 "By establishing a grand confraternity that links the various branches of the Eastern churches, we bind the Orthodox world to our throne. Our religious leadership is now recognized by all faithful nations, facilitating diplomatic annexations and mutual defense."
 flavor_armenia.16.a:0 "We are the champions of the true faith."

 flavor_armenia.17.t:0 "Seats of the Patriarchs"
 flavor_armenia.17.d:0 "Our conquests have brought the ancient Pentarchy back into Christian hands. By officially establishing these cities as the seats of our Patriarchs, we consolidate our religious authority and prepare the ground for a grand Ecumenical Council."
 flavor_armenia.17.a:0 "The ancient sees are restored."

 flavor_armenia.18.t:0 "The Ecumenical Council"
 flavor_armenia.18.d:0 "With the major religious centers under our control, we have convened an Ecumenical Council to address the theological disputes that have plagued the church for centuries. How shall our monarch direct the proceedings?"
 flavor_armenia.18.a:0 "Focus on invoking piety and spiritual renewal."
 flavor_armenia.18.b:0 "Focus on resolving internal theological disputes."
 flavor_armenia.18.c:0 "Focus on solidifying the authority of the Patriarch."

 flavor_armenia.19.t:0 "The Bagratuni Legacy"
 flavor_armenia.19.d:0 "A prominent noble family, claiming descent from the ancient Bagratuni kings, has offered their extensive wealth and expertise to the state. We can employ their finest tactician in our navy, or leverage their immense trade networks."
 flavor_armenia.19.a:0 "We need their naval expertise."
 flavor_armenia.19.b:0 "Their mercantile connections are invaluable."

 flavor_armenia.20.t:0 "Armenian Merchants Regain Prominence"
 flavor_armenia.20.d:0 "Our merchants, once overshadowed by the Italians and Muslims, are now the masters of Eurasian trade. We must decide how best to support their endeavors to maximize the flow of wealth into our empire."
 flavor_armenia.20.a:0 "Subsidize their private trade fleets."
 flavor_armenia.20.b:0 "Rely heavily on burgher loans."
 flavor_armenia.20.c:0 "Promote free enterprise and deregulation."

 flavor_armenia.21.t:0 "The Royal Purple"
 flavor_armenia.21.d:0 "Our imperial cartographers ask how our vast empire should be represented on the grand maps of the world. Some suggest we retain our traditional colors, while others propose adopting the Imperial Purple of Rome to signify our universal dominance."
 flavor_armenia.21.a:0 "Keep our traditional colors."
 flavor_armenia.21.b:0 "Adopt the Imperial Purple."

 flavor_armenia.22.t:0 "Changing Trade Goods"
 flavor_armenia.22.d:0 "State investments have fundamentally changed the economic output of this province. We now have the infrastructure to transition the local economy to produce highly lucrative luxury goods."
 flavor_armenia.22.a:0 "Transition the local production."
 flavor_armenia.22.b:0 "Focus on generalized growth instead."

 flavor_armenia.23.t:0 "The Master Mosaicists"
 flavor_armenia.23.d:0 "Armenian art and architecture, particularly our breathtaking mosaics, are the envy of the known world. We have received requests from foreign courts asking us to send our master artisans to beautify their palaces. To whom shall we grant this honor?"
 flavor_armenia.23.a:0 "Send them to our closest allies."
 flavor_armenia.23.b:0 "Send them to the most powerful foreign court."
 flavor_armenia.23.c:0 "Send them to the wealthiest foreign king."
 flavor_armenia.23.e:0 "Keep our artists at home to beautify our own cities."

 flavor_armenia.24.t:0 "Armenian Artisans Arrive"
 flavor_armenia.24.d:0 "The glorious Armenian Empire has sent their master artisans to our court! Their exquisite mosaics and architectural designs will greatly enhance our prestige, though their services do not come cheap."
 flavor_armenia.24.a:0 "Pay them whatever they ask. It is worth it."
 flavor_armenia.24.b:0 "We cannot afford their exorbitant fees."

 flavor_armenia.25.t:0 "Growing Demand for Silk"
 flavor_armenia.25.d:0 "The stability and wealth of our empire have created an insatiable demand for luxury fabrics among the nobility. The price of silk is skyrocketing across our markets."
 flavor_armenia.25.a:0 "Our silk producers will grow incredibly wealthy."

 flavor_armenia.26.t:0 "The Theme System"
 flavor_armenia.26.d:0 "To govern our vast and diverse empire, we must reform our provincial administration. Reimplementing the ancient Theme system—where civil and military administration are unified under a strategos—will ensure the rapid mobilization of troops and the security of the frontiers."
 flavor_armenia.26.a:0 "Enact the Theme System."
 flavor_armenia.26.b:0 "We need more time to prepare the bureaucracy."

 flavor_armenia.27.t:0 "Administrative Focus"
 flavor_armenia.27.d:0 "Our empire stands at a crossroads. We must decide whether to centralize power entirely in the capital, ensuring total royal authority, or decentralize our administration to grant more autonomy and efficiency to the provinces."
 flavor_armenia.27.a:0 "Proceed with our current plans."
 flavor_armenia.27.b:0 "Shift towards a Decentralized administration."
 flavor_armenia.27.c:0 "Shift towards a Centralized administration."
 flavor_armenia.27.e:0 "Make no changes at this time."

 flavor_armenia.28.t:0 "The Pronoia System"
 flavor_armenia.28.d:0 "The Pronoia system grants revenue streams and land to prominent individuals in exchange for military service. We must refine how these grants operate within our empire to maximize our military potential."
 flavor_armenia.28.a:0 "Increase our reliance on the Pronoiars."
 flavor_armenia.28.b:0 "Pronoiars shall no longer reduce our force limit."
 flavor_armenia.28.c:0 "Pronoiars shall actively contribute to our force limit."

 flavor_armenia.29.t:0 "Hereditary Pronoiars"
 flavor_armenia.29.d:0 "The nobles holding Pronoia grants demand that their lands and titles become hereditary. Granting this will please the aristocracy and provide different long-term benefits to the state."
 flavor_armenia.29.a:0 "Pronoiars shall be hereditary by default."
 flavor_armenia.29.b:0 "Inheriting a Pronoia will now seize Crownland."
 flavor_armenia.29.c:0 "Pronoia subjects shall focus on Military Tradition."
 flavor_armenia.29.e:0 "Pronoia subjects shall focus on Discipline."

 flavor_armenia.30.t:0 "The Capital Outgrows its Walls"
 flavor_armenia.30.d:0 "Our capital has experienced explosive growth. Merchants, artisans, and peasants flock to the city in such numbers that the population is spilling out far beyond the ancient walls. The city is truly the heart of the world."
 flavor_armenia.30.a:0 "A testament to our boundless prosperity."

 flavor_armenia.31.t:0 "The Exkousseiai Privilege"
 flavor_armenia.31.d:0 "The tax exemptions granted to foreign merchants are severely damaging our domestic economy. The local burghers are outraged by the unfair competition. We must address this imbalance."
 flavor_armenia.31.a:0 "Force the foreigners to pay their fair share."
 flavor_armenia.31.b:0 "Accept the loss in trade efficiency to keep the peace."
 flavor_armenia.31.c:0 "Revoke the privilege entirely!"

 flavor_armenia.32.t:0 "A Challenger to the Throne"
 flavor_armenia.32.d:0 "A charismatic and dangerous noble has stepped forward, claiming that the current monarch is unfit to rule and that he possesses a stronger claim to the imperial throne. The realm is on edge."
 flavor_armenia.32.a:0 "We must deal with this pretender."

 flavor_armenia.33.t:0 "Unionist Revolt"
 flavor_armenia.33.d:0 "Our attempts to reconcile the Eastern and Western churches have enraged the orthodox hardliners. Viewing the Union as sheer heresy, massive mobs led by furious monks are rising up in armed rebellion!"
 flavor_armenia.33.a:0 "May God have mercy on us."

 flavor_armenia.34.t:0 "We Mend the Schism"
 flavor_armenia.34.d:0 "The historic council has concluded. The authority of the Pope is broken, and the Patriarchs have restored the true, undivided Christian Church under our protection. The Catholic nations of the West must now face the truth."
 flavor_armenia.34.a:0 "A new era for Christendom!"

 flavor_armenia.35.t:0 "Hovhannes' Command"
 flavor_armenia.35.d:0 "A brilliant, battle-hardened commander named Hovhannes has offered his sword to defend the faith and the empire. His expertise in siege warfare and defense will be vital for the campaigns ahead."
 flavor_armenia.35.a:0 "Put him in charge of the defenses."

 flavor_armenia.36.t:0 "Confirm the Union of Florence"
 flavor_armenia.36.d:0 "The controversial Union of Florence, meant to bridge the gap with the Catholic West in exchange for military aid, is deeply unpopular among our people. We must definitively choose whether to enforce it or abandon it."
 flavor_armenia.36.a:0 "We must remain open to the West."
 flavor_armenia.36.b:0 "Abandon the Union. We stand alone."

 flavor_armenia.37.t:0 "The Pronoia Subject"
 flavor_armenia.37.d:0 "A Pronoia is a special type of subject nation, created by granting the revenue of a territory to a loyal noble in exchange for military service. They do not cost diplomatic relations and provide vital military aid, though they pay no direct taxes."
 flavor_armenia.37.a:0 "An interesting administrative tool."

