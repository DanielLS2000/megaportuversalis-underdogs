l_english:
 afr_mediterranean_ambition_title:0 "Mediterranean Ambitions"
 afr_mediterranean_ambition_desc:0 "To secure our rightful place in the Mediterranean, we must construct a formidable armada. A grand fleet of galleys will project our power across the inland sea and secure our claims from Provence to Greece."
 afr_navy_title:0 "African Navy"
 afr_navy_desc:0 "Our dominion requires a fleet capable of defending our shores and securing our trade routes. By expanding our naval capacity and appointing capable admirals, we shall lay claim to the Barbary Coast."
 afr_consulate_of_sea_title:0 "Consulate of the Sea"
 afr_consulate_of_sea_desc:0 "Establishing a structured legal framework for maritime trade and disputes will vastly improve our commercial efficiency. The Consulate of the Sea will cement our influence over the Ligurian and Tuscan waters."
 afr_balearics_title:0 "Integrate Mesuderraniu"
 afr_balearics_desc:0 "The islands of the western Mediterranean form a natural defensive perimeter for our realm. Bringing the Balearics, Corsica, Sardinia, and Sicily under our direct administration will solidify our base of power."
 afr_naples_title:0 "Humiliate Naples"
 afr_naples_desc:0 "The Kingdom of Naples presents an obstacle to our Italian ambitions. By thoroughly dominating the Neapolitan lands, we shall break their spirit and seize control of southern Italy's wealth."
 afr_pillars_of_hercules_title:0 "The Pillars of Hercules"
 afr_pillars_of_hercules_desc:0 "Control over the Strait of Gibraltar is vital for both trade and defense. Securing both the Andalusian coast and Northern Morocco will grant us the keys to the Mediterranean and open the way into Iberia."
 afr_the_six_provinces_title:0 "The Six Provinces"
 afr_the_six_provinces_desc:0 "With strong footholds established in southern Iberia, the integration of these lands into our core administration will legitimize our rule and unlock a new era of Andalusian cooperation."
 afr_morocco_title:0 "Crown of Morocco"
 afr_morocco_desc:0 "The diverse and fractious lands of the Maghreb must be brought under a single sovereign. By asserting control over Morocco, we can finally pacify the Barbary pirates and unite the region."
 afr_murcia_title:0 "Nova Cartago"
 afr_murcia_desc:0 "Reclaiming the ancient prosperity of the Iberian southeast will serve as a launchpad for further conquest. Dominating Valencia and Toledo ensures our economic superiority on the peninsula."
 afr_genoa_title:0 "Dominate Genoa"
 afr_genoa_desc:0 "Genoa has long been a rival in Mediterranean trade. By subjugating Liguria and controlling the bustling ports of the Genoese Republic, we will redirect the wealth of Italy into our coffers."
 afr_italia_consulare_title:0 "Italia Proconsulare"
 afr_italia_consulare_desc:0 "The rich plains of northern Italy beckon. By extending our administration into Tuscany, Piedmont, and Lombardy, we recreate the ancient proconsular authority, dominating the peninsula entirely."
 afr_italian_wars_title:0 "Victory in the Italian Wars"
 afr_italian_wars_desc:0 "The struggle for Italy has been long and bloody. Emerging victorious and uniting the disparate states under our hegemony will definitively establish our supremacy in Europe."
 afr_eastern_expansion_title:0 "Eastern Expansion"
 afr_eastern_expansion_desc:0 "With our western flank secured, we must look to the East. Expanding our influence into the Morea and the Aegean will position us as the premier power in the eastern Mediterranean."
 afr_greek_lands_title:0 "Kingdom of Greece"
 afr_greek_lands_desc:0 "The ancient Greek lands offer unparalleled wealth and strategic value. By conquering the Aegean and Northern Greece, we claim the legacy of empires past and assert our dominance in the Orient."
 afr_asian_port_title:0 "Gateway to the East"
 afr_asian_port_desc:0 "To truly harness the wealth of the East, we need a robust port city in the Levant. Upgrading our infrastructure in Cyprus will turn it into the jewel of Mediterranean commerce."
 afr_conquer_cyprus_title:0 "The Island of Cyprus"
 afr_conquer_cyprus_desc:0 "Cyprus sits at the crossroads of empires. Taking direct control of the island gives us an unsinkable fortress from which to project power into Syria, Egypt, and Anatolia."
 afr_maghreb_title:0 "King of Africa"
 afr_maghreb_desc:0 "The entirety of the Maghreb is now within our grasp. Uniting these lands and proclaiming ourselves the undisputed masters of North Africa will elevate our nation to true Great Power status."
 afr_mare_nostrum_title:0 "Mare Nostrum"
 afr_mare_nostrum_desc:0 "The Mediterranean is our sea. By possessing the strongest fleet and dominating the surrounding coastlines, we revive the ancient Roman boast: Mare Nostrum."
 afr_defender_of_faith_title:0 "Guardian of Christendom"
 afr_defender_of_faith_desc:0 "Our military might and religious devotion make us the natural shield of the true faith. Standing firm as the Defender of the Faith will bring glory to our crown and awe to our enemies."
 afr_golden_century_title:0 "Golden Century"
 afr_golden_century_desc:0 "Our conquests in the Mediterranean and beyond have brought unimaginable wealth and prestige. This is truly our Golden Century, an era of cultural and economic flourishing."
 afr_banks_title:0 "Bank of Africa"
 afr_banks_desc:0 "A strong economy requires strong financial institutions. By establishing centralized banking systems in our capital, we ensure the stability and growth of our national treasury."
 afr_renaissance_title:0 "Renaissance City"
 afr_renaissance_desc:0 "Patronage of the arts and sciences will transform our capital into a beacon of the Renaissance. We must attract the brightest minds and foster an environment of intellectual rebirth."
 afr_trade_title:0 "Mediterranean Trade"
 afr_trade_desc:0 "To dominate global trade, we must first master our home waters. Upgrading our centers of trade and aggressively pursuing market monopolies will yield untold riches."
 afr_tunisian_silk_title:0 "Tunisian Silk"
 afr_tunisian_silk_desc:0 "The artisans of Tunis have long worked with fine fabrics. By heavily investing in the region's development, we can transform Tunis into a world-renowned center for silk production."
 afr_industry_title:0 "Industrial Districts"
 afr_industry_desc:0 "We must move beyond mere resource extraction. Building advanced manufactories for wine, glass, and paper will create specialized industrial districts, driving our economy forward."
 afr_guilds_title:0 "Tripolitanian Guilds"
 afr_guilds_desc:0 "Organizing the craftsmen of our coastal cities into powerful guilds will streamline production. Empowering the burghers in Tripoli will lead to increased productivity and wealth."
 afr_economic_liberalism_title:0 "Economic Liberalism"
 afr_economic_liberalism_desc:0 "To maximize our trade efficiency, we must embrace the theories of modern economics. Empowering visionary statesmen like Cavour will modernize our trade policies and stimulate massive growth."
 afr_silk_title:0 "Promote Sericulture"
 afr_silk_desc:0 "Silk is highly prized across Europe. By developing the infrastructure and expertise in our southern provinces, we can break foreign monopolies and weave our own prosperous future."
 afr_wine_title:0 "Latin Wine"
 afr_wine_desc:0 "The climate of our lands is perfect for viticulture. Establishing state monopolies and promoting our vintages will ensure our wine is demanded at every noble table in Europe."
 afr_glass_title:0 "Latin Crystal"
 afr_glass_desc:0 "Mastering the delicate art of glassmaking will provide us with a highly lucrative luxury export. Investing in the artisans of Venice and Naples will create a crystal monopoly."
 afr_roman_question_title:0 "The Roman Question"
 afr_roman_question_desc:0 "The status of Rome and its religious authorities must be addressed. By asserting our spiritual or secular dominance over the Holy City, we will answer the Roman Question once and for all."
 afr_industrial_triangle_title:0 "Industrial Triangle"
 afr_industrial_triangle_desc:0 "Connecting the major urban centers of Catalonia, Naples, and Tunisia will create a powerhouse of production. This 'Industrial Triangle' will be the engine of our empire."
 afr_plus_ultra_title:0 "Beyond the Pillars"
 afr_plus_ultra_desc:0 "Our destiny lies not just in the Mediterranean, but across the vast oceans. We must sponsor explorers to sail beyond the Pillars of Hercules and discover the New World."
 afr_conquer_indonesia_title:0 "Conquest of the Indies"
 afr_conquer_indonesia_desc:0 "The true wealth of the East lies in the Spice Islands. Establishing a firm grip on Sumatra and the surrounding archipelagos will grant us a monopoly on the world's most precious commodities."
 afr_discover_indonesia_title:0 "The Spice Islands"
 afr_discover_indonesia_desc:0 "Rumors of islands overflowing with cloves and nutmeg reach our ports. We must navigate the treacherous waters of the Indian Ocean and chart a course to Malaya and Indonesia."
 afr_new_carthage_title:0 "Viceroyalty of New Carthage"
 afr_new_carthage_desc:0 "As our overseas colonies grow, they require proper administration. Establishing the Viceroyalty of New Carthage will ensure our colonial subjects are governed efficiently and loyally."
 afr_reform_the_military_title:0 "Military Reforms"
 afr_reform_the_military_desc:0 "To fight on equal terms with the great powers, our army must modernize. By drilling our troops and moving past the era of unreliable Condottieri, we will forge a professional fighting force."
 afr_galleasses_title:0 "Perfect the Galleass"
 afr_galleasses_desc:0 "The galleass represents a revolution in naval warfare, combining the firepower of a galleon with the maneuverability of a galley. Perfecting this design will make our inland fleet invincible."
 afr_merchant_fleet_title:0 "Merchant Fleet"
 afr_merchant_fleet_desc:0 "Trade is the lifeblood of our empire. Constructing a massive fleet of light ships and securing robust shipyards will protect our trade routes and project our commercial power globally."
 afr_genoa_node_title:0 "Genoese Domination"
 afr_genoa_node_desc:0 "The Genoese trade node is one of the richest in the world. By monopolizing its commerce and developing the local centers of trade, we will capture wealth flowing from across the globe."
 afr_imperium_title:0 "New World Imperium"
 afr_imperium_desc:0 "Our colonial ambitions span continents. By establishing numerous thriving colonies across the Americas, we build an imperium where the sun never sets, securing endless prosperity."
 afr_minas_gerais_title:0 "Minas Gerais"
 afr_minas_gerais_desc:0 "Reports speak of massive deposits of precious metals hidden in the interior of Brazil. Securing and exploiting the mines of Minas Gerais will flood our treasury with untold riches."
 afr_new_world_gold_title:0 "The Gold Trade"
 afr_new_world_gold_desc:0 "The New World is abundant in gold. By seizing control of the richest mining provinces and maximizing their production, we will fuel our global ambitions with endless bullion."
 afr_explore_atlantic_title:0 "Deep in the Atlantic"
 afr_explore_atlantic_desc:0 "We must push further into the unknown. Commissioning conquistadors and explorers to chart the coastlines of Brazil and the Caribbean will open the door to a new era of colonization."
 afr_sugar_trade_title:0 "The Land of Sugar"
 afr_sugar_trade_desc:0 "The tropical climate of the Brazilian coast is ideal for cultivating sugar. Monopolizing the production in Bahia and Pernambuco will make us the sweetmasters of Europe."
 afr_west_african_market_title:0 "The Ivory Market"
 afr_west_african_market_desc:0 "The coast of Guinea is rich with ivory and other exotic goods. Establishing a strong trading presence there will allow us to tap into the lucrative West African market."
 afr_western_african_ports_title:0 "Ports of Western Africa"
 afr_western_african_ports_desc:0 "To secure the route to India and consolidate our African holdings, we must establish a chain of fortified ports along the West African coast. This will ensure our ships always have a safe harbor."
 afr_mediterranean_alliances_title:0 "Crowns of the Mediterranean"
 afr_mediterranean_alliances_desc:0 "We cannot dominate the sea alone. Forging strong diplomatic ties and historical friendships with key regional powers will secure our flanks and legitimize our maritime hegemony."
 afr_develop_south_italy_title:0 "Develop the Two Sicilies"
 afr_develop_south_italy_desc:0 "The lands of southern Italy have immense untapped potential. By heavily developing Naples, Apulia, and Sicily, we will transform the region into the economic heartland of our empire."
 afr_atlantic_stronghold_title:0 "Atlantic Stronghold"
 afr_atlantic_stronghold_desc:0 "To protect our vital Atlantic trade routes from piracy and rival empires, we must build heavily fortified cities in the New World. A strong colonial presence is essential for our security."
