l_english:
 underdogs_afghan_sindh_title:0 "Campaign in Sindh"
 underdogs_afghan_sindh_desc:0 "By pacifying the restless tribes of Sindh, we shall secure our access to the sea and integrate their vast wealth into our burgeoning empire."
 underdogs_afghan_forcelimit_title:0 "The Grand Army"
 underdogs_afghan_forcelimit_desc:0 "To forge an empire across the subcontinent, we must exponentially expand our military ranks and drill them to absolute perfection."
 underdogs_afghan_punjab_title:0 "Pacify the Punjab"
 underdogs_afghan_punjab_desc:0 "The five rivers of Punjab form the breadbasket of the subcontinent. We must establish total control over these plains to feed our ambitions."
 underdogs_afghan_afghan_frontier_title:0 "The Afghan Frontier"
 underdogs_afghan_afghan_frontier_desc:0 "Consolidating our homeland in the rugged mountains of Afghanistan ensures a safe and impregnable base for our eastern expansions."
 underdogs_afghan_nepal_title:0 "Conquer the Himalayas"
 underdogs_afghan_nepal_desc:0 "The fierce warriors of the Nepalese highlands would make fine additions to our armies. We must bring their mountain kingdoms under our suzerainty."
 underdogs_afghan_hindusthan_title:0 "Emperor of Hindustan"
 underdogs_afghan_hindusthan_desc:0 "Securing the vast and fertile Gangetic Plain is the ultimate proof of our divine mandate to rule all of India."
 underdogs_afghan_rajputana_title:0 "Subdue Rajputana"
 underdogs_afghan_rajputana_desc:0 "The proud Rajput warrior clans must be brought to heel. Through diplomacy or the sword, their formidable lands will be integrated into the empire."
 underdogs_afghan_bengal_title:0 "The Ganges Delta"
 underdogs_afghan_bengal_desc:0 "Bengal is a region of immense wealth, thriving commerce, and fertile land. Its subjugation is paramount for the financial stability of our state."
 underdogs_afghan_abu_saids_dream_title:0 "Abu Said's Dream"
 underdogs_afghan_abu_saids_dream_desc:0 "Reclaiming the ancient Timurid heartlands and uniting the Persian plateau has long been a dream of our ancestors. It is time to make it a reality."
 underdogs_afghan_tripura_title:0 "The Eastern Marches"
 underdogs_afghan_tripura_desc:0 "The dense jungles and winding rivers of the east hold great strategic value. Securing Tripura opens the gateway to further conquests in Burma."
 underdogs_afghan_malwa_title:0 "Conquer Malwa"
 underdogs_afghan_malwa_desc:0 "The plateau of Malwa connects the north to the wealthy Deccan. Taking this region gives us the logistical upper hand for a southern campaign."
 underdogs_afghan_gujarat_title:0 "Secure the Hajj Ports"
 underdogs_afghan_gujarat_desc:0 "The wealthy maritime state of Gujarat controls the vital ports from which pilgrims depart for the Hajj. We must seize control of this spiritual and economic lifeline."
 underdogs_afghan_trade_title:0 "Dominate Indian Trade"
 underdogs_afghan_trade_desc:0 "By heavily investing in our coastal emporiums and monopolizing trade, the wealth of the Indian Ocean will flow directly into our treasury."
 underdogs_afghan_berar_title:0 "Across the Vindhyas"
 underdogs_afghan_berar_desc:0 "To truly conquer the Deccan, we must first shatter the resistance in Berar and Khandesh, establishing a secure foothold south of the Vindhya mountains."
 underdogs_afghan_orissa_title:0 "The Orissan Coast"
 underdogs_afghan_orissa_desc:0 "Marching south from Bengal into Orissa will secure a continuous coastline, integrating more valuable trade nodes and rich farmlands."
 underdogs_afghan_burma_title:0 "The Burmese Campaign"
 underdogs_afghan_burma_desc:0 "With the east secured, we must cross the mountains and extend our dominion over the rich kingdoms of Burma, asserting our dominance in Southeast Asia."
 underdogs_afghan_into_India_title:0 "Influence the West"
 underdogs_afghan_into_India_desc:0 "With our power firmly rooted in Hindustan, we must now look back to the Persian heartlands and exert our cultural and military influence over them."
 underdogs_afghan_andhra_title:0 "Riches of Golconda"
 underdogs_afghan_andhra_desc:0 "The fabled diamond mines and rich trading posts of Golconda and Andhra will fund our imperial ambitions for generations to come."
 underdogs_afghan_maidan_title:0 "The Central Deccan"
 underdogs_afghan_maidan_desc:0 "Pacifying the high plateaus of the central Deccan is crucial to linking our northern domains with the deep south."
 underdogs_afghan_religion_title:0 "Religious Harmony"
 underdogs_afghan_religion_desc:0 "A vast empire cannot survive constant internal religious strife. We must foster an environment of tolerance and syncretism."
 underdogs_afghan_sufi_shrines_title:0 "Patronize Sufi Shrines"
 underdogs_afghan_sufi_shrines_desc:0 "Sufi mystics have great influence over the masses. By funding their shrines and embracing their teachings, we can create a deeply spiritual and unified society."
 underdogs_afghan_tolerant_society_title:0 "A Tolerant Society"
 underdogs_afghan_tolerant_society_desc:0 "By ensuring that all subjects, regardless of faith, are treated with justice and respect, we lay the foundation for a truly stable empire."
 underdogs_afghan_coromandel_title:0 "Coromandel Coast"
 underdogs_afghan_coromandel_desc:0 "The bustling trade ports of the Coromandel coast will serve as our launching pad into the Indian Ocean and the spice-rich archipelagos."
 underdogs_afghan_rise_safavids_title:0 "The Persian Lion"
 underdogs_afghan_rise_safavids_desc:0 "Our ascendance to absolute greatness demands that we eclipse the rising powers of Persia, establishing our empire as the supreme Islamic state."
 underdogs_afghan_riches_title:0 "Establish Mint Towns"
 underdogs_afghan_riches_desc:0 "Standardizing our currency and establishing robust mint towns across the empire will drastically increase our economic efficiency."
 underdogs_afghan_jizya_title:0 "Reform the Jizya"
 underdogs_afghan_jizya_desc:0 "Abolishing or reforming the Jizya tax will earn us the undying loyalty of our non-Muslim subjects, cementing our rule over India."
 underdogs_afghan_ibadat_khana_title:0 "The House of Worship"
 underdogs_afghan_ibadat_khana_desc:0 "We shall build the Ibadat Khana, a grand house of worship where theologians, philosophers, and scholars of all faiths can debate the nature of the divine."
 underdogs_afghan_din_i_ilahi_title:0 "Din-i Ilahi"
 underdogs_afghan_din_i_ilahi_desc:0 "By promulgating a new syncretic faith, the Din-i Ilahi, we aim to merge the best elements of the empire's religions into one unifying philosophy centered on the sovereign."
 underdogs_afghan_agra_title:0 "The Metropolis of Agra"
 underdogs_afghan_agra_desc:0 "Agra must be transformed into a dazzling metropolis, a capital worthy of our magnificent empire, filled with grand forts and splendid gardens."
 underdogs_afghan_urbanize_the_subahs_title:0 "Urbanize the Subahs"
 underdogs_afghan_urbanize_the_subahs_desc:0 "Promoting urbanization and infrastructure across our provinces will ensure social mobility and economic growth throughout the empire."
 underdogs_afghan_weaving_title:0 "Gujarati Textiles"
 underdogs_afghan_weaving_desc:0 "By monopolizing and refining the ancient textile industries of Gujarat and Bengal, our silks and cloths will become highly sought after across the globe."
 underdogs_afghan_grand_trunk_road_title:0 "The Grand Trunk Road"
 underdogs_afghan_grand_trunk_road_desc:0 "Rebuilding and extending the ancient Grand Trunk Road will connect the furthest reaches of our empire, boosting trade and facilitating rapid troop movements."
 underdogs_afghan_industry_title:0 "Fires of Industry"
 underdogs_afghan_industry_desc:0 "We must look to the future. Building extensive manufactories and embracing early industrialization will make us the foremost economic power on Earth."
 underdogs_afghan_fatehpur_sikri_title:0 "Fatehpur Sikri"
 underdogs_afghan_fatehpur_sikri_desc:0 "The creation of a brand new, meticulously planned imperial capital at Fatehpur Sikri will serve as a testament to our architectural genius and infinite wealth."
 underdogs_afghan_taj_mahal_title:0 "The Taj Mahal"
 underdogs_afghan_taj_mahal_desc:0 "A monument of unparalleled beauty, the Taj Mahal will stand for centuries as a symbol of our profound devotion and unmatched architectural grandeur."
 underdogs_afghan_red_fort_title:0 "The Red Fort"
 underdogs_afghan_red_fort_desc:0 "Constructing the massive Red Fort will provide us with an impregnable bastion from which to safely project our imperial authority."
 underdogs_afghan_indian_entrepot_title:0 "Entrepot of India"
 underdogs_afghan_indian_entrepot_desc:0 "By turning our major ports into the undisputed trade hubs of the East, we will completely control the flow of exotic goods to Europe."
 underdogs_afghan_economic_power_title:0 "Economic Powerhouse"
 underdogs_afghan_economic_power_desc:0 "With our vast resources and advanced infrastructure, our nation will transition into an unstoppable economic juggernaut."
 underdogs_afghan_mansabdars_title:0 "Mansabdar System"
 underdogs_afghan_mansabdars_desc:0 "Reforming our military hierarchy into the Mansabdari system will ensure that our officers are fiercely loyal and our troops are efficiently organized."
 underdogs_afghan_hegemon_title:0 "Imperial Hegemony"
 underdogs_afghan_hegemon_desc:0 "With our enemies vanquished and our economy unparalleled, we shall declare ourselves the undisputed hegemons of the civilized world."
 underdogs_afghan_outward_title:0 "Look Outward"
 underdogs_afghan_outward_desc:0 "Our dominion over the land is absolute. We must now construct a massive navy and look outward across the oceans to secure our global interests."
 underdogs_afghan_mughal_architecture_title:0 "Architectural Marvels"
 underdogs_afghan_mughal_architecture_desc:0 "The distinctive blend of Persian, Islamic, and Indian architectural styles we have pioneered will leave a legacy of breathtaking monuments."
 underdogs_afghan_land_assessment_title:0 "General Land Assessment"
 underdogs_afghan_land_assessment_desc:0 "A comprehensive survey and assessment of all imperial lands will root out corruption and ensure the treasury receives its rightful due."
 underdogs_afghan_dahsala_title:0 "The Dahsala System"
 underdogs_afghan_dahsala_desc:0 "Implementing the Dahsala system of taxation will stabilize our state revenues, basing taxes on a ten-year average of harvests and prices."
 underdogs_afghan_rajputs_title:0 "Rajput Mansabdars"
 underdogs_afghan_rajputs_desc:0 "By integrating the fiercely independent Rajput warriors into our Mansabdari system, we turn former foes into our most loyal and capable commanders."
 underdogs_afghan_cavalry_title:0 "Master the Cavalry"
 underdogs_afghan_cavalry_desc:0 "Our roots lie in the mobile cavalry warfare of the steppes. We must perfect these tactics and combine them with the formidable war elephants of India."
 underdogs_afghan_gunpowder_empire_title:0 "A Gunpowder Empire"
 underdogs_afghan_gunpowder_empire_desc:0 "The future of warfare lies in gunpowder. By outfitting our armies with massive cannons and disciplined musketeers, no fortress will withstand our assault."
 underdogs_afghan_recruitment_title:0 "Integrate the Purbias"
 underdogs_afghan_recruitment_desc:0 "The Purbia mercenaries of the east are renowned for their skill with firearms. We must integrate them deeply into our standing army."
 underdogs_afghan_western_allies_title:0 "Embassy to the West"
 underdogs_afghan_western_allies_desc:0 "The rising powers of Europe must be engaged. Sending grand embassies to the West will secure favorable alliances and lucrative technological exchanges."
 underdogs_afghan_subahs_title:0 "The Subahdar Administration"
 underdogs_afghan_subahs_desc:0 "Dividing our vast empire into highly organized Subahs (provinces), each ruled by a loyal Subahdar, will ensure total administrative efficiency and absolute control."