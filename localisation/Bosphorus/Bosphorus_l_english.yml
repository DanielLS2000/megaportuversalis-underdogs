l_english:
 bsp_italian_relations_title:0 "Mercantile Relations"
 bsp_italian_relations_desc:0 "The Italian merchant republics have long dominated the trade of the Black Sea. We must decide whether to ally with them for mutual prosperity or challenge their hegemony to claim the wealth for ourselves."
 bsp_black_sea_domination_title:0 "Black Sea Domination"
 bsp_black_sea_domination_desc:0 "The Black Sea is the lifeblood of our economy. By heavily developing our centers of trade and outmaneuvering foreign merchants, we will turn our capital into the undisputed jewel of the Euxine Sea."
 bsp_black_sea_fleet_title:0 "Black Sea Fleet"
 bsp_black_sea_fleet_desc:0 "To protect our coasts and enforce our will upon the waves, we must construct a dedicated fleet. A strong armada of galleys will secure our ports against any foreign blockade or pirate incursions."
 bsp_dealing_with_italians_title:0 "Dealing with Merchants"
 bsp_dealing_with_italians_desc:0 "Our initial diplomatic posture towards the Italian merchants has been set. Now we must follow through, either by welcoming their Renaissance influence into our court or by forcefully seizing their trade posts."
 bsp_gothia_title:0 "Gothia Ascendant"
 bsp_gothia_desc:0 "We are no longer a mere remnant of the past. Our state has grown significantly in power and prestige. It is time to formally proclaim the ascension of Gothia, a kingdom that will stand the test of time."
 bsp_raise_army_title:0 "A Gothic Army"
 bsp_raise_army_desc:0 "A true kingdom requires a true army. We must draft the stout men of our lands and form a professional fighting force capable of defending our borders and expanding our realm."
 bsp_goths_and_romans_title:0 "The Goths and the Romans"
 bsp_goths_and_romans_desc:0 "Our relations with the local enclaves in Crimea must be resolved. Whether through diplomacy, vassalization, or outright conquest, we must unite the peninsula under our banner."
 bsp_beyond_crimea_title:0 "Beyond Crimea"
 bsp_beyond_crimea_desc:0 "The Crimean peninsula is secure, but the vast steppes to the north and east beckon. We must push beyond our traditional borders and assert our dominance over the nomadic lands."
 bsb_ruthenia_title:0 "Plains of Ruthenia"
 bsb_ruthenia_desc:0 "The fertile plains of Ruthenia have long been fractured by petty lords and foreign invaders. By bringing these lands under our control, we will secure a vast agricultural base for our empire."
 bsp_carpathia_title:0 "Danubian Frontier"
 bsp_carpathia_desc:0 "Expanding our borders and projecting our cultural influence secures our flanks. We must integrate these new territories to protect our heartland from foreign incursions."
 bsp_bolster_the_defences_title:0 "Bolster the Defences"
 bsp_bolster_the_defences_desc:0 "The world is a dangerous place for a rising power. We must invest heavily in modern fortifications and engineering to ensure our strongholds can withstand the longest of sieges."
 bsp_kingdoms_of_the_caucasus_title:0 "Kingdoms of the Caucasus"
 bsp_kingdoms_of_the_caucasus_desc:0 "The rugged mountains of the Caucasus are home to proud and ancient kingdoms. We must bring them into our sphere of influence, either through careful diplomacy or by the edge of the sword."
 bsp_ruthenian_conquest_title:0 "Basileus of Ruthenia"
 bsp_ruthenian_conquest_desc:0 "Our armies march triumphantly across the region. We must consolidate these conquests and establish ourselves as the undisputed sovereign of the East."
 bsp_integrate_cossacks_title:0 "$MONARCHTITLE$'s Vanguard"
 bsp_integrate_cossacks_desc:0 "The fierce horsemen of the steppes are a force to be reckoned with. By granting them privileges and integrating them into our military structure, we will gain a fearsome vanguard for our armies."
 bsp_foreign_aid_title:0 "Foreign Aid"
 bsp_foreign_aid_desc:0 "In a world of hostile empires, finding a strong ally is paramount. By cultivating a deep and trusting alliance with the emerging Russian power, we can secure military aid and protect our borders."
 bsp_foreign_guard_title:0 "Guards of the [Root.GovernmentName]"
 bsp_foreign_guard_desc:0 "As our state grows, so too does the need for elite, loyal troops. By reforming our military and recruiting foreign guards, we will field an army capable of facing any great power."
 bsp_russian_aristocracy_title:0 "Russian Aristocracy"
 bsp_russian_aristocracy_desc:0 "The balance of power in the East requires us to deal with the Russian nobility. We must either embrace an alliance with them or build an army strong enough to shatter their ambitions."
 bsp_rising_power_title:0 "Rising Power"
 bsp_rising_power_desc:0 "We have surpassed our ancient rivals. Our nation is now recognized as a rising power on the world stage, ready to shape the destiny of the region."
 bsp_restore_kiev_title:0 "Restore Kiev"
 bsp_restore_kiev_desc:0 "The ancient city of Kiev has suffered greatly over the centuries. By bringing it into our realm, we shall restore its former glory and legitimize our rule over the region."
 bsp_steppe_development_title:0 "Settling the Goths"
 bsp_steppe_development_desc:0 "The vast steppes are often seen as barren wastelands, but with careful investment and settlement, they can be transformed into highly productive and prosperous provinces."
 bsp_wargames_title:0 "Promote Wargames"
 bsp_wargames_desc:0 "To keep our troops sharp during times of peace, we must institute grand wargames and martial tournaments. This will ensure our generals and soldiers never lose their edge."
 bsp_religious_question_title:0 "Matters of Religion"
 bsp_religious_question_desc:0 "As our empire expands, we absorb peoples of many different faiths. We must definitively answer the religious question: shall we be the sword of orthodoxy, or a beacon of tolerance?"
 bsp_principality_title:0 "Sovereign Principality"
 bsp_principality_desc:0 "To command respect among the nations of the world, our ruler must govern from a truly sovereign and heavily fortified principality, unbowed by any foreign overlord."
 bsp_economic_revitalization_title:0 "Economic Revitalization"
 bsp_economic_revitalization_desc:0 "We must embark on a grand campaign of economic revitalization, investing heavily in local infrastructure and workshops to enrich the state."
 bsp_gold_deposits_title:0 "Gold Deposits"
 bsp_gold_deposits_desc:0 "Rumors of rich mineral deposits in our mountainous provinces have circulated for years. We must send prospectors and scientists to exploit these veins of gold and copper."
 bsp_new_trade_routes_title:0 "Establish New Trade Routes"
 bsp_new_trade_routes_desc:0 "The old trade routes are shifting. We must establish new commercial arteries, upgrading our marketplaces and securing our position as a vital regional crossroads."
 bsp_ecclesiastical_architecture_title:0 "Ecclesiastical Architecture"
 bsp_ecclesiastical_architecture_desc:0 "To demonstrate our piety and the wealth of our state, we must commission grand cathedrals. These magnificent structures will inspire the faithful and awe our visitors."
 bsp_crimean_church_title:0 "Crimean Church"
 bsp_crimean_church_desc:0 "The religious institutions in Crimea must be reorganized and strengthened. By appointing a dedicated Metropolitan, we will ensure the spiritual unity of our people."
 bsp_connection_to_silk_road_title:0 "Connect to the Silk Road"
 bsp_connection_to_silk_road_desc:0 "The legendary Silk Road flows with unimaginable wealth. We must extend our commercial reach into Persia and Central Asia to tap directly into this lucrative network."
 bsp_intercontinental_trade_title:0 "Continental Trade"
 bsp_intercontinental_trade_desc:0 "Our realm sits at the intersection of Europe and Asia. By dominating the flow of goods between these continents, we will establish a truly intercontinental trade empire."
 bsp_monopolize_black_sea_title:0 "Monopolize the Black Sea"
 bsp_monopolize_black_sea_desc:0 "The Black Sea is ours. By monopolizing its trade and pushing out foreign competitors, we will ensure that every ducat generated on its shores finds its way into our treasury."
 bsp_legacy_of_crusade_title:0 "Legacy of the Crusades"
 bsp_legacy_of_crusade_desc:0 "By fostering a truly tolerant and unified society, we can heal the wounds of past religious conflicts and build a stronger, harmonious future for all our subjects."