l_english:
 bosphorus_ideas:0 "Bosphoran Ideas"
 bosphorus_ideas_start:0 "Bosphoran Traditions"
 bosphorus_ideas_bonus:0 "Bosphoran Ambition"

 bsp_mercenary_contracts:0 "Mercenary Contracts"
 desc_bsp_mercenary_contracts:0 "Our position at the crossroads of empires means we are never short of gold, nor are we short of men willing to fight for it. By formalizing our relationships with free companies and foreign veterans, we can maintain professional mercenary hosts for a fraction of the usual cost."

 bsp_masters_of_the_strait:0 "Masters of the Strait"
 desc_bsp_masters_of_the_strait:0 "From the ports of Crimea to the mouth of the Dnieper, our merchants dominate the local waters. By leveraging our strategic control over the Black Sea chokepoints, we can ensure that the lion's share of trade power remains firmly in our own hands."

 bsp_gothic_cavalry:0 "Gothic Cavalry Tradition"
 desc_bsp_gothic_cavalry:0 "We are the descendants of the Goths, and the open steppes of our northern frontiers demand swift and decisive warfare. By breeding the finest horses and training our nobles in the art of the cavalry charge, our mounted hosts will shatter the lines of any who dare oppose us."

 bsp_crimean_emporiums:0 "Crimean Emporiums"
 desc_bsp_crimean_emporiums:0 "The ancient Greek and Genoese colonies of the Crimea have long been hubs of unimaginable wealth. By investing in these bustling emporiums and standardizing our tariffs, we can drastically improve the efficiency of our trade networks."

 bsp_pontic_agriculture:0 "Pontic Agriculture"
 desc_bsp_pontic_agriculture:0 "The dark, fertile soils of our realm are capable of producing bountiful harvests and sustaining robust local industries. By promoting efficient agricultural techniques and supporting local artisans, we can significantly boost our overall production output."

 bsp_fortify_the_frontier:0 "Fortify the Steppe Frontier"
 desc_bsp_fortify_the_frontier:0 "To survive in a land bordered by aggressive hordes and ambitious empires, we must build and rebuild. By streamlining our construction methods and offering incentives for the fortification of our borders, we can build faster and ensure our people are always ready to replenish the ranks."

 bsp_defenders_of_orthodoxy:0 "Defenders of the Orthodoxy"
 desc_bsp_defenders_of_orthodoxy:0 "Our faith is our shield. As a bastion of the Orthodox Church in a region fraught with infidels and heretics, our people are filled with a righteous zeal. When the call to arms is sounded, true believers will flock to our banners from across the realm to defend the motherland."
