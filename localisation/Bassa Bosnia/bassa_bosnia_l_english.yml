l_english:
 defy_rome_s_fate: "Defy Rome's fate"
 defy_rome_s_fate_desc: "We Must not Repeat Rome's mistakes of Uncontrollable expansion we must integrate our lands carefully to not have the same fate of rome and we must keep its legacy not only as an base for our society but as an warning to learn from their mistakes"
 la_roma_di_balcani: "La Roma di Balcani"
 la_roma_di_balcani_desc: "We are the rome of the balkans we literally use the same strategy of conscription rome once did but with less requirements to join the army anyone can join the army to defend their fatherland agaisn't the muslims and orthodoxes who for years invaded bosnia and we always revived like an phoenix"
 study_the_punic_wars: "Study The Punic Wars"
 study_the_punic_wars_desc: "The punic wars is an subject of military brilliant tactics with the most brilliant generals of their time using cavalry like we do we must study both hannibal and scipio and create new warfare tactics based on speed and flanking and of course discipline our first duke name was scipio so we must study the person who gaved name to our first ruler"
 sicilian_legacy: "Sicilian Legacy"
 sicilian_legacy_desc: "As our old duke Scipio the great the one who expanded our lands to an small duke of germany and his son scipio the second started an war campaign and gained an small territory on the sudentland we finally finished the goal of scipio the great immigrate to the balkans after sicily was occupied by an african kingdom"
 land_of_the_cattle: "Land of the Cattle"
 land_of_the_cattle_desc: "Our land is mountainous and very harsh florest terrains we can't just plant vegetables or fruits we are dependent on imports so we were basically dependent on imports until we decided to make our pecuary systems that gives peasants jobs plus good quality meat for all of our kingdom plus being cheap unlike in other countries where beef is expensive"
 southslavic_resistance_spirit: "South Slavic Resistance Spirit"
 southslavic_resistance_spirit_desc: "As an country with heritage of southslavia plus in the southslavic group yet we still speak sicilian we are the only latin nation in the balkans currently we must use our southslavic spirit of messapian culture to combine the resistance of slavic people with the will to fight of latin countries nobody will invade us without consequences we shall resist until the end of times death before dishonor."
 adriatic_sea_trade_route: "Adriatic Sea Trade Route"
 adriatic_sea_trade_route_desc: "Our trade route to the adriatic sea is very beneficial most countries of the holy roman empire use our lands to buy spice salt and other products they always use our route to benefit to this we shall put an small tax one that benefits us but don't make them look for alternatives or make them think they are being extorted"
