l_english:
 bsb_weaken_hungary_title:0 "Weaken Hungary"
 bsb_weaken_hungary_desc:0 "we need to make hungary weaker and humiliate them to get an personal union"
 bsb_magyar_union_title:0 "Slav-Magyar Union"
 bsb_magyar_union_desc:0 "We finally got an personal union in the hungarians now the Slav-magyar union is estabilished  furthering our goals of expansion our old enemie the huns are now our greatest allies and friends"
 bsb_mosia_borderlands_title:0 "Mosia Borderlands"
 bsb_mosia_borderlands_desc:0 "the border lands of mosia are magnificent we must expand on the region of bulgaria to get more resources to our warmachine furthering our ambitions"
 bsb_bohemian_claims_title:0 "Legacy of Scipio"
 bsb_bohemian_claims_desc:0 "the sudetenland was once the lands of scipio the great before the great immigration to the balkans we were given this land for an dynasty of bohemia that doesn't exist anymore but it gives us legitimate claims in the bohemian lands furthering our goals"
 bsb_weaken_the_ostmark_title:0 "Weaken Ostmark"
 bsb_weaken_the_ostmark_desc:0 "we must weaken ostmark to further our expansion in the region to connect our bohemian and hungarian and other lands to give it an better connection"
 bsb_gosti_title:0 "Italian Immigrants"
 bsb_gosti_desc:0 "we should attract italian immigrants to better industrialize"
 bsb_northern_trade_title:0 "Ragusan Trade"
 bsb_northern_trade_desc:0 "we must expand our influence in the adriatic by using merchant ships to dominate the ragusa trade node"
 bsb_zagreb_title:0 "Cattle Lands of Zagreb"
 bsb_zagreb_desc:0 "Zagreb is our main industry of pecuary we should expand it to have more food for the army"
 bsb_industrialize_bassa_title:0 "Industrialize Bassa"
 bsb_industrialize_bassa_desc:0 "Bassa bósnia is our main lands of raw metal we must expand its capabilities to make more weaponry"
 bsb_zvonimirs_Forts_title:0 "The Forts of Zvonimirs"
 bsb_zvonimirs_Forts_desc:0 "The Znonimirs our fortification class had been advancing in new projects of fortification on our lands"
 bsb_industrialize_title:0 "Industrial Revolution"
 bsb_industrialize_desc:0 "we are way back in the industrial revolution we must quickly get our industrialization plan going to not get behind the other regional powers and great powers"
 bsb_port_title:0 "The Ports of the Adriatic"
 bsb_port_desc:0 "we must make the greatest ports in the adriatic possible to attract more trade investments and burghers to our lands"
 bsb_dominate_dubrovnik_title:0 "The Route of Ragusa"
 bsb_dominate_dubrovnik_desc:0 "our trade route in ragusa was expanded to an point that is the greatest trade route in eastern europe for the anatolians and indias to sell their spices  for eastern and western europe with our taxation methods not only our trade power improves but also we get money from the purchases of people going in our trade route and also from their sellers"
 bsb_revitalize_the_economy_title:0 "Economic Reconstruction"
 bsb_revitalize_the_economy_desc:0 "after the last wars agaisn't byzantine and hungary in the last decade our economy is in shambles we must reconstruct whatever is left of it in order to further our expansion ambitions"
 bsb_slavonian_breadbasket_title:0 "Slavonia Bread Basket"
 bsb_slavonian_breadbasket_desc:0 "Slavonia is the land where produces more bread on our country by improving it we satisfy both the nobles with more complex bread types and also the peasants to have more food to eat satisfying the stomach of our populations"
 bsb_fertile_lands_of_bosnia_title:0 "Fertile lands of Bosnia"
 bsb_fertile_lands_of_bosnia_desc:0 "Bosnia has very fertile lands althought they don't work with wheat and other types of plants they are perfect for pecuary and to our cattle to thrive and eat sustainful food we should improve it to further our meat production"
 bsb_the_order_of_the_dragon_title:0 "Order of the Dragon"
 bsb_the_order_of_the_dragon_desc:0 "the order of the dragon is not only the remnacents of our old crusaders that fighted on morrocos and also on egypt but also our most elite warriors why use them for war when we can reinforce our will and keep the stability of the kingdom instead after all they are fanatic loyalists to our kingdom"
 bsb_fortress_of_vrhbosna_title:0 "Fortress of VrhBosna"
 bsb_fortress_of_vrhbosna_desc:0 "we should increase our fortifications in the vrhbosna province not only is great agaisn't the greek invaders but also agaisn't the hungarian invaders"
 bsb_fekete_sereg_title:0 "Crna armada"
 bsb_fekete_sereg_desc:0 "the Black army also known as the Black armada in bosnian is our elite mercenaries people that are willing to die for our country at any costs not only making them elite but making them complete suicidal for the crown at times fighting battles of odds not in favour of us we must expand them"
 bsb_the_black_legion_title:0 "Black legion"
 bsb_the_black_legion_desc:0 "with the Crna armada expanded we now must integrate it in our nation as part of the armed forces plus upgrading it with better equipment for new times"
 bsb_consolidate_title:0 "Consolidate the South"
 bsb_consolidate_desc:0 "we must consolidate macedonia and the other territories that are slavs to better our country"
 bsb_the_despotate_of_rascia_title:0 "Despotate of Rascia"
 bsb_the_despotate_of_rascia_desc:0 "We must get the hands on rascia and its resources and remove them from constantinople rule to further our ambitions"
 bsb_Albanian_Subjugation_title:0 "Albanian Subjugation"
 bsb_Albanian_Subjugation_desc:0 "The albanians althought are slavs like us they are mixed with anatolian and other groups they should be subjugated before constantinople gets their hand on them"
 bsb_deal_with_the_impaler_title:0 "Deal with the Dracula"
 bsb_deal_with_the_impaler_desc:0 "we must deal with the dracula in our borders in order to pacify them they speak latin like us it should be easier than normal especially since we are slavs that mixed with latin and they are another group of the balkans the vlachs who mixed with the latin language"
 bsb_unite_with_the_styrria_title:0 "Unite With Styrria"
 bsb_unite_with_the_styrria_desc:0 "we should unite styrria under our command to further our ambitions of an greater empire on the balkans"
 bsb_bibliotheca_corviniana_title:0 "Library of Corvinia"
 bsb_bibliotheca_corviniana_desc:0 "our library has thousands of books in the world and we preserved most of the balkan history in our great library"
 bsb_trading_cities_title:0 "Trading Cities of the balkans"
 bsb_trading_cities_desc:0 "we should expand our trading cities in our country to better expand resources and knowledge of the outside world"
 bsb_found_Sarajevo_title:0 "Founding of Bassa Sarajevo"
 bsb_found_Sarajevo_desc:0 "we must found an new capital that has better defense better positions to defend agaisn't external threats"
 bsb_universitas_Sicipolitana_title:0 "University Sicipolitana"
 bsb_universitas_Sicipolitana_desc:0 "our university with sicilian methods is the best University in the balkans being able to turn peasants in anstounding warriors well known medics skilled blacksmiths and more we should improve it in order to get the peasant population with more jobs less dependent on the nobles"
 bsb_Balkan_Renaissance_title:0 "Balkan Renaissance"
 bsb_Balkan_Renaissance_desc:0 "we must adopt and improve our culture using the Renaissance in order to better improve our country"
 bsb_the_great_city_of_Sarajevo_title:0 "The Great City of Sarajevo"
 bsb_the_great_city_of_Sarajevo_desc:0 "we finally founded our new capital but there is still things to do improve our capital to become an great center of our communities and south slavic cultures"
 bsb_develop_free_royal_towns_title:0 "Develop Peasant Towns"
 bsb_develop_free_royal_towns_desc:0 "with the burghers support we are able to not only fund houses to the peasants of our country but finally give them indenpendence of the nobles finally giving them property and houses of their own"
 bsb_fund_the_monasteries_title:0 "Fund the Churches"
 bsb_fund_the_monasteries_desc:0 "as the bastion of catholicism in the balkans we must fund the churches to get better relations and support of the pope to show our devotion to jesus christ"
 bsb_promote_the_pope_title:0 "Promote the Pope"
 bsb_promote_the_pope_desc:0 "we must promote the pope and its ideas to further strenghten our position as catholic in an region with hostile faiths fully converting the heretics not throught violence but throught forgiveness just like jesus tolded us"
 bsb_bulwark_of_christianity_title:0 "Bastion of Catholicism"
 bsb_bulwark_of_christianity_desc:0 "We are the bastion of catholicism in the balkans keeping the evil orthodoxy church of the fake romans(greeks) of further expanding in the north of the balkans"
 bsb_reissue_the_novo_brdo_code_title:0 "Novo Brdo Code"
 bsb_reissue_the_novo_brdo_code_desc:0 "the new code is following laws to help the church and the peasants in need in order to get more stable nation"
 bsb_church_title:0 "The Church of Bassa"
 bsb_church_desc:0 "we finally builded the greatest church in the balkans millions of catholic people in the balkans travel just to pray on it we are finally achieving unity throught faith on the first time ever in the balkans"
 bsb_reform_the_nomocanon_title:0 "Reform our Churches"
 bsb_reform_the_nomocanon_desc:0 "our churches should show the forgiveness of jesus and its support for the weak and the poor by extending our teachings to show the heretics that jesus is the way the truth and the light and that there is redemption throught our actions further more we should add other teachings too that in times of war jesus always help out those in need"
 bsb_vinodol_code_title:0 "Revised Legal Code"
 bsb_vinodol_code_desc:0 "our legal code gives not much punishment for those who are evil or bandits or even punishment for heretics furthermore we should revise our legal code as the old mesopotamians did an eye for an eye plus making sure if an bandit robs an family or kills an family he gets executed and burned alive to be punished by his sins"
 bsb_expel_friulians_title:0 "Expel the Friulians"
 bsb_expel_friulians_desc:0 "we must expel the friulians from the southern slav lands they are expanding further on slovene we must not allow it they get their ambitions"
 bsb_address_the_cultural_situation_title:0 "The Cultural Situation"
 bsb_address_the_cultural_situation_desc:0 "we are an empire with lots of cultures much of them with not much in common we must unite and stabilize them giving us an common goal and further influencing their cultures to become as south slavic as us"
 bsb_a_multicultural_empire_title:0 "Multicultural Empire"
 bsb_a_multicultural_empire_desc:0 "we must defy the reason rome collapse rome collapse because it expanded too thin and large and in the vertical plus the barbarian tribes and other cultures that hated each other to deny rome's fate we must incentivize coexistance in our cultures"
 bsb_royal_navy_title:0 "Royal Navy"
 bsb_royal_navy_desc:0 "our royal navy is very outdated it needs some reforms to increase its capabilities"
 bsb_merchant_fleet_title:0 "Merchant Fleet"
 bsb_merchant_fleet_desc:0 "we must create an merchant fleet in order to get more trades and control the adriatic sea fully"
 bsb_galley_title:0 "Canarian Galleys"
 bsb_galley_desc:0 "The Canaries have the best galleys in the world right now we must study their fleets to use this knowledge in order to improve our galleys to rule the mediterraen"
 bsb_multi_role_fleet_title:0 "Multirole Fleet"
 bsb_multi_role_fleet_desc:0 "we must make an fleet that makes not just one role but all of them galleys to protect the meditteraen transport ships for naval invasion light ships for trade and warfare and heavy ships to be the lead of the fleet in order to protect the rest of the fleet"
 bsb_naval_powerhouse_title:0 "Mare Nostrum"
 bsb_naval_powerhouse_desc:0 "like the romans did we now rule the mediterraen with an iron fist nobody beats up our naval legacy in the balkans"
 bsb_Illyrian_empire_title:0 "Illyrian Empire Achieved"
 bsb_Illyrian_empire_desc:0 "we finally consolidated the balkans therefore we finally achieved empire status we will be one of the great powers of europe or at least an regional power we finally reformed illyria as an empire"
 bsb_naval_capacity_title:0 "Naval Increasing"
 bsb_naval_capacity_desc:0 "we must increase our navy capacity to further our ambitions in the adriatic"
 bsb_illyrian_sucession_title:0 " Illyrian sucession"
 bsb_illyrian_sucession_desc:0 "the illyrian sucession is at our hands we must choose our new heir to the throne"
