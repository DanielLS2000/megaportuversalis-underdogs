l_english:
 luticia_show_of_strength_title:0 "Raise the Wendish Flag"
 luticia_show_of_strength_desc:0 "For generations, the Wends were spoken of as a people to be ruled, taxed, and forgotten. Those days end beneath our banners. Let the princes of Germany count our strongholds and discover that the Sorbian lands have raised a power of their own."
 luticia_army_reforms_1_title:0 "The Soldier's Calling"
 luticia_army_reforms_1_desc:0 "A brave peasant may win a skirmish; a trained soldier wins a war. Our young realm can no longer rely on men summoned from their ploughs. We shall forge standing regiments whose loyalty is to Luticia, and whose craft is victory."
 luticia_army_reforms_2_title:0 "The Iron Discipline"
 luticia_army_reforms_2_desc:0 "Drill until the musket is an extension of the hand. March until the ranks move as one. A smaller host that obeys without hesitation may humble an army twice its size; such shall be the terrible reputation of the Wendish regiments."
 luticia_army_reforms_3_title:0 "An Army with a State"
 luticia_army_reforms_3_desc:0 "Other rulers maintain armies to defend their kingdoms. We shall shape a kingdom capable of sustaining an army without equal. From the Sorbian village to the royal arsenal, every road, forge, and ledger will serve the strength of our people."
 luticia_renovate_berlin_title:0 "Berlin Reborn"
 luticia_renovate_berlin_desc:0 "A capital should inspire more than obedience. Where once stood a frontier town, let stone halls, busy workshops, and learned men proclaim the confidence of a rising crown. Berlin must become a city that even our enemies cannot help but admire."
 luticia_ansbach_succession_title:0 "The Marcher Throne"
 luticia_ansbach_succession_desc:0 "No dynasty survives by awaiting the generosity of its neighbors. With the seat of our authority secured, we may speak to the princes of the northern marches not as petitioners, but as their equals, rivals, and perhaps one day their masters."
 luticia_lower_saxony_title:0 "Humble the Saxon Lords"
 luticia_lower_saxony_desc:0 "Between the Elbe and the western roads stand lords who have long treated the Slavic marches as a prize to be divided. Let them now learn the bitter novelty of conquest from the east. The roads into our homeland shall belong to us."
 luticia_westphalian_conquest_title:0 "Beyond the Weser"
 luticia_westphalian_conquest_desc:0 "The Weser is no wall raised by God to halt our ambitions. Beyond it lie walled towns, rich bishoprics, and princes confident in the distance from our armies. We shall teach them that the reach of the Wendish crown is measured in marches, not miles."
 luticia_duchy_of_cleves_title:0 "The Rhine Beckons"
 luticia_duchy_of_cleves_desc:0 "Along the Rhine, merchants grow wealthy while electors bargain over the fate of empires. We have not fought across Germany merely to watch this river enrich other crowns. Secure its northern banks and let Luticia take her place at the council of western powers."
 luticia_rhineland_conquest_title:0 "Lords of the Rhine"
 luticia_rhineland_conquest_desc:0 "The workshops of the Rhineland furnish cannon, coin, and ambition in equal measure. Their wealth once paid for armies marching eastward. Henceforth those forges will supply our own, and the river that nourished our rivals will strengthen the Wendish throne."
 luticia_german_empire_title:0 "Crown of the Wends"
 luticia_german_empire_desc:0 "They called our forefathers barbarians beyond the imperial frontier. Now their heirs stand before the gates of imperial greatness. We shall wear the crown without surrendering our tongue, our memory, or our blood: the empire will learn that a Wend may be its master."
 luticia_build_to_force_limit_title:0 "Sound the Sorbian Horn"
 luticia_build_to_force_limit_desc:0 "Let the horns sound from the Lusatian hills to the market squares of our towns. Smiths shall mend the swords, captains shall call the rolls, and every household shall know that a new age has begun. Our enemies must find us ready."
 luticia_conquer_saxonia_title:0 "Unite Sorbian Lands"
 luticia_conquer_saxonia_desc:0 "Our kinsmen live among borders drawn by strangers, their villages scattered between jealous lords. These divisions are a wound left by centuries of weakness. Bring the Lusatian marches beneath one banner, so no Sorbian hearth need look to a foreign prince for protection."
 luticia_connect_the_prussian_lands_title:0 "The Bohemian Gate"
 luticia_connect_the_prussian_lands_desc:0 "The mountains have sheltered kings and divided armies, but their passes can serve us as readily as our enemies. Secure the roads into Bohemia and the Saxon uplands. Where our forefathers saw a barrier, the new Lutician army shall make a gateway."
 luticia_strengthen_old_ties_title:0 "Crowns Bound by Blood"
 luticia_strengthen_old_ties_desc:0 "Polish and Wendish courts have exchanged envoys, vows, and threats for generations. A marriage sealed in a chapel may alter the fate of a kingdom as surely as a battle. Let us decide whether these ties shall become an enduring union or a reckoning of rival claims."
 luticia_warsaw_and_krakow_title:0 "Two Seats, One Crown"
 luticia_warsaw_and_krakow_desc:0 "Warsaw and Krakow hold more than royal halls: they hold the memory and pride of Poland. Their allegiance will be neither won nor kept by force alone. Yet when both cities bow to one sovereign, the Polish crown can no longer be used against us."
 luticia_conquer_poland_title:0 "The Vistula March"
 luticia_conquer_poland_desc:0 "The lands beyond the Polish heartland have been crossed by armies since before the memory of our oldest chronicles. We will not leave these roads in hostile hands. From the Vistula to the southern marches, every fortress must answer to our authority."
 luticia_prussia_partitions_poland_title:0 "A Crown Undivided"
 luticia_prussia_partitions_poland_desc:0 "The mapmakers may draw a hundred lines between Polish, Wendish, and Prussian lands; our dynasty need recognize only one allegiance. Let old privileges be respected where they serve the peace, but let no lesser banner be raised against the crown that united them."
 luticia_fortify_the_borders_title:0 "Walls of the Realm"
 luticia_fortify_the_borders_desc:0 "A frontier bought with blood must not be abandoned to the next invading army. Raise bastions where the roads narrow, fill the granaries, and place seasoned captains over the walls. Our children shall sleep behind fortresses that their fathers never possessed."
 luticia_empire_of_the_east_title:0 "Empire of Iron"
 luticia_empire_of_the_east_desc:0 "An empire cannot live forever on victory songs. Its soldiers require bread, its cities require order, and its sovereign requires a treasury worthy of the task. From the Baltic ports to the northern plains, let prosperity become the second pillar of our might."
 luticia_edict_of_potsdam_title:0 "A Haven for the Exiled"
 luticia_edict_of_potsdam_desc:0 "Let other sovereigns drive craftsmen and scholars from their homes over matters of conscience. We shall offer them roofs, workshops, and the protection of our laws. Every exile who begins anew beneath our banner will make Luticia richer than intolerance ever could."
 luticia_enlightened_absolutism_title:0 "The Wise Sceptre"
 luticia_enlightened_absolutism_desc:0 "Power untempered by judgment is merely violence enthroned. Our sovereign must master both the battlefield and the written law. Let learned counsel refine our authority, so that the strong hand which united the realm may also govern it wisely."
 luticia_seek_imperial_protection_title:0 "Within the Empire"
 luticia_seek_imperial_protection_desc:0 "The Holy Roman Emperor once looked east upon our lands as an uncertain border. Now the crown of Luticia must be acknowledged among the princes whose decisions shape the Empire. Let recognition be our shield until strength allows us to choose our own destiny."
 luticia_the_balance_of_power_title:0 "The Game of Crowns"
 luticia_the_balance_of_power_desc:0 "Kings smile across banquet tables while their ministers count cannon and debts. We shall learn to play this game as masters, finding allies among the mighty and rivals worthy of our steel. No council of Europe will decide our fate in our absence."
 luticia_proof_of_strength_title:0 "Trial by Steel"
 luticia_proof_of_strength_desc:0 "Fine uniforms impress courtiers; only battle impresses history. Let our officers face an enemy who can truly wound us and return with banners still flying. The day Europe discovers the strength of Lutician arms will be remembered far beyond our borders."
 luticia_conquer_lithuania_title:0 "Keys to the Baltic"
 luticia_conquer_lithuania_desc:0 "Samogitia and the Prussian marches hold the approaches to the northern sea. Whether their princes are bound to us by oath or humbled by arms, these gates cannot remain uncertain. Whoever commands them will decide the fate of the Baltic coast."
 luticia_livonian_alliance_title:0 "The Volhynian Accord"
 luticia_livonian_alliance_desc:0 "Halicz-Volhynia is no distant court to our house. Blood and marriage have bound its fortunes to our dynasty, though rival ambitions may yet divide us. A faithful alliance would guard our eastern flank; a hostile prince must be taught the cost of forgetting old oaths."
 luticia_strengthen_livonia_title:0 "The Volhynian Legacy"
 luticia_strengthen_livonia_desc:0 "The claims of our dynasty do not end where a foreign mapmaker draws his line. Volhynia belongs to the history of our house, and the eastern marches remember the names of those who ruled them. By loyal agreement or settled authority, that inheritance must be made secure."
 luticia_a_prussian_navy_title:0 "The Wendish Fleet"
 luticia_a_prussian_navy_desc:0 "A people who have marched from the forests to the sea must learn a new kind of war. Build ships sturdy enough for Baltic storms and captains bold enough to challenge its masters. Our banners shall fly where once only foreign sails were seen."
 luticia_strengthen_mercantilism_title:0 "Masters of Baltic Coin"
 luticia_strengthen_mercantilism_desc:0 "A cannon is cast in iron but paid for in silver. Our merchants know every harbor where that silver changes hands. Protect their ventures, strengthen the ports, and turn Baltic trade into the purse from which the armies of Luticia draw their strength."
 luticia_emden_company_title:0 "Beyond the Seas"
 luticia_emden_company_desc:0 "From Emden our merchants dream of waters no Wendish captain has yet charted. Let them seek spices beyond Africa, even the distant shores of Madagascar, and return with riches worthy of a great power. The crown shall grant its protection, and expect its share."
 luticia_chinese_trade_title:0 "Silk for Wendish Steel"
 luticia_chinese_trade_desc:0 "Far beyond the Baltic lies a market older and richer than the courts of Europe. If our merchants can contend for the trade of China, silk and silver will flow homeward while our foundries burn brighter. Even distant emperors shall know the reach of Wendish enterprise."
 luticia_disciplined_army_title:0 "Lords of the Muster"
 luticia_disciplined_army_desc:0 "A noble title cannot stop a cavalry charge. Let the great families earn their honors in the saddle and on the parade ground, where cowardice cannot hide behind ancestry. The crown will reward service, and the army will answer to no private lord."
 luticia_conquer_silesia_title:0 "The Lusatian Shield"
 luticia_conquer_silesia_desc:0 "Lusatia and Silesia are the shield wall of our homeland. Too often have foreign hosts crossed these roads while Sorbian villages paid the price. Unite the marches and make their fortresses our own; the next invader shall meet Lutician steel before he reaches our hearths."
 luticia_take_over_moldavia_title:0 "At Austria's Gates"
 luticia_take_over_moldavia_desc:0 "The Habsburg lands once seemed a world apart from our frontier towns. Now Lutician soldiers stand before their gates. Secure Austria and let Vienna understand that our crown will never again be the lesser voice in the councils of the south."
 luticia_push_into_ruthenia_title:0 "The Amber Road"
 luticia_push_into_ruthenia_desc:0 "From Samogitia to Livonia, the northern routes carry furs, amber, armies, and rival claims. Secure the ports and crossings, then bind them to the marches farther east, where our dynasty has interests of its own. No foreign master shall close this road to Luticia."
 luticia_teutonic_ruthenia_title:0 "The Baltic Dominion"
 luticia_teutonic_ruthenia_desc:0 "A line of forts and scattered oaths is not yet a kingdom. The Baltic coast and its Polish approaches must be joined beneath a government able to defend them all. Let our enemies discover that the Wendish standard does not vanish when the army marches away."
 luticia_fortify_dnieper_title:0 "The Iron Frontier"
 luticia_fortify_dnieper_desc:0 "The frontier is where a realm either proves its strength or reveals its weakness. Set modern walls above the crossings, arm them with cannon, and place watchful garrisons in their towers. An invader may enter our marches, but he shall not pass through them unchallenged."
 luticia_dominate_baltic_trade_title:0 "The Baltic Is Ours"
 luticia_dominate_baltic_trade_desc:0 "The sea has filled foreign coffers for centuries while our people watched from its shores. No longer. Let our merchants command its busiest markets and our ships guard the routes between them. Whoever owns the trade of the Baltic holds a weapon as powerful as any army."
 luticia_kiel_canal_title:0 "Between Two Seas"
 luticia_kiel_canal_desc:0 "What nature divided, Wendish ambition may yet unite. A passage from the Baltic to the North Sea would spare our fleets a perilous voyage and make our ports the hinge of northern commerce. Let the engineers draw their plans; the crown will think in centuries."
 luticia_empower_the_junkers_title:0 "Nobility in Service"
 luticia_empower_the_junkers_desc:0 "The lords of the land have long demanded privileges in exchange for loyalty. We offer a sterner bargain: keep your honors, but furnish officers, horses, and obedience when the crown calls. Let the nobility become the backbone of our armies, not a rival to the throne."
 luticia_reclaim_neumark_title:0 "The Eastern March"
 luticia_reclaim_neumark_desc:0 "The Oder does not mark the limit of our memory. Neumark has passed between grasping hands while its people bore the cost of every bargain. Secure both banks of the frontier and make the marches a bridge between our lands, not a prize for other princes."
 luticia_konigsberg_development_title:0 "A Beacon of Learning"
 luticia_konigsberg_development_desc:0 "A realm that can build fortresses can also raise a city of scholars. Let professors, craftsmen, and merchants gather under our protection, and let their achievements travel farther than our armies. The glory of Luticia must be written in books as well as chronicles of war."
 luticia_develop_the_country_title:0 "Riches of the Uplands"
 luticia_develop_the_country_desc:0 "The Bohemian uplands were once valued chiefly for the passes through which armies could march. We shall give them another purpose. Open workshops, enrich the towns, and make the mountains yield a prosperity that will survive long after the drums fall silent."
 luticia_franconian_conquest_title:0 "The Northern Road"
 luticia_franconian_conquest_desc:0 "Mecklenburg and the Saxon lowlands are more than lands to be colored on a map. They carry the grain, timber, and trade that feed a growing state. Secure the road to the coast, and our armies will never again march with empty wagons."
 luticia_employ_advisors_title:0 "Council of the Crown"
 luticia_employ_advisors_desc:0 "A sword may win a throne, but ink and judgment keep it. We need ministers who can balance the treasury, read the intentions of foreign courts, and provision an army before its general asks. Let talent, not flattery, earn a place at our council table."
 luticia_reform_the_state_title:0 "Forge the Royal State"
 luticia_reform_the_state_desc:0 "From the smallest village reeve to the highest minister, the king's orders must travel without being lost to bribery or confusion. Let every office know its duty and every province its obligation. An orderly state is the quiet victory behind every triumph in war."
 luticia_absolute_kingdom_title:0 "One Crown, One Will"
 luticia_absolute_kingdom_desc:0 "Too many princes have hidden their private ambitions behind the language of ancient liberties. The realm cannot answer five masters when danger approaches. Unite authority beneath the crown, and let the law speak with a single voice from the Baltic to the southern marches."
 luticia_prussian_enlightenment_title:0 "The Scholar's Republic"
 luticia_prussian_enlightenment_desc:0 "The pen need not be an enemy of the sword. Universities shall train engineers for our fortresses, jurists for our courts, and physicians for our people. Let Luticia prove that a state renowned for discipline may also become a refuge of reason."
 luticia_crush_the_republics_title:0 "Against the Revolution"
 luticia_crush_the_republics_desc:0 "Across Europe, crowns tremble and old loyalties are broken in the streets. We shall not leave the fate of Luticia to foreign pamphlets or rival generals. Whether we conquer the new age or bend its fury to our will, the Wendish state will endure."
