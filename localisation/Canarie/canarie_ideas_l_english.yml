l_english:
 dalmatian_expeditions: "Dalmatian Expeditions"
 dalmatian_expeditions_desc: "Born from the fractured shores of the Adriatic and hardened by the treacherous currents of the Atlantic, our people learned early that the survival of the Dalmatian soul depended on mastering the waves. Our daring fleets have transformed the open ocean from a barrier into a highway for our destiny."
 transatlantic_renaissance: "Transatlantic Renaissance"
 transatlantic_renaissance_desc: "The great migration across the sea did not mean the death of our ancient heritage. By blending the scholarly traditions of Rome and Byzantium with the fresh realities of the New World, a unique cultural and technological awakening is taking root across our faithful provinces."
 the_fortunate_isles: "The Fortunate Isles"
 the_fortunate_isles_desc: "What were once untamed and volcanic outposts have been successfully tamed into prosperous lands. Through relentless sweat and visionary administration, our colonies yield rich resources, turning these isolated islands into a beacon of economic growth and stability."
 legacy_of_the_adriatic: "Legacy of the Adriatic"
 legacy_of_the_adriatic_desc: "Though our home in Ragusa was lost to the tides of history, the blood ties and commercial instincts remain unbreakable. By forging robust trade networks with our distant cousins and distant allies across Iberia and Italy, our merchants command the wealth of multiple seas."
 mesoamerican_campaigns: "Mesoamerican Campaigns"
 mesoamerican_campaigns_desc: "In the heart of the tropical jungles and arid plateaus of Central America, our infantry faced ancient empires and hostile native domains. Tempered by relentless warfare against the Aztecs, the discipline and combat prowess of our soldiers are now feared throughout the New World."
 shadows_of_the_old_world: "Shadows of the Old World"
 shadows_of_the_old_world_desc: "The ocean does not isolate us from Europe; it merely grants us the vantage point of an outsider. With strong maritime reach and dedicated marine forces, our armies stand ready to cross the Atlantic and violently intervene in the turbulent politics of the Old Continent."
 haven_of_outcasts: "Haven of Outcasts"
 haven_of_outcasts_desc: "Just as our ancestors found salvation away from the crushing grip of empires, our realm remains an open sanctuary for the persecuted and the displaced. By welcoming diverse waves of refugees, we foster rapid development and build magnificent cities out of a shared dream of freedom."
