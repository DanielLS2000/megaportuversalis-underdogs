l_english:
 dalmatian_migration_title: "The Great Exodus"
 dalmatian_migration_desc: "Our people are no strangers to the bitterness of exile. Generations ago, we left the shores of the Adriatic to found the Kingdom of Canarie on these islands in search of peace. However, the aggressive consolidation of Iberia and Morocco by Crusader states casts a new shadow over our sovereignty. We will not wait for their fleets to reach our beaches. With recent voyages beyond the Azores and the daring expeditions sponsored by our King into the unknown West, a vast and untouched land has been revealed: Bani. The time has come to gather our families, abandon Macaronesia to its fate, and cross the great ocean. In the New World, we shall forge our true and final home."

 the_great_migration: "Brave New World"
 the_great_migration_desc: "The survivors of the perilous and lethal Atlantic crossing have been forged by loss and storm. Those who landed on the new shores of Bani possess a relentless determination and will defend their new home with unmatched ferocity."
