l_english:
 canarie_plus_ultra_title:0 "Plus Ultra"
 canarie_plus_ultra_desc:0 "The pillars of the ancient world lie far behind us. We must steer our caravels into the boundless western sea, following the whispers of uncharted shores."
 canarie_caribbean_discovery_title:0 "Brave New World"
 canarie_caribbean_discovery_desc:0 "The endless horizon has at last broken, revealing lush, sun-drenched archipelagos ripe for Dalmatian exploration and settlement."
 canarie_havana_title:0 "Western Island"
 canarie_havana_desc:0 "The lush valleys and sheltered deepwater bays of Cuba offer an ideal heartland for our Caribbean settlements, securing the sea lanes to the continent."
 canarie_new_home_title:0 "A New Home"
 canarie_new_home_desc:0 "Centuries after fleeing the ruins of our old Adriatic hearth, our people have raised their first true towns across the sea. The Dalmatian soul takes root in the west."
 canarie_immigrants_title:0 "The Dalmatian Exodus"
 canarie_immigrants_desc:0 "Displaced kin and persecuted refugees across Europe answer our call, boarding outbound fleets to build their lives in a sanctuary founded by outcasts."
 canarie_cartagena_title:0 "Bastion of Cartagena"
 canarie_cartagena_desc:0 "Securing the northern coastline of Tierra Firme requires a formidable naval citadel to anchor our fleets and guard the gateway to the southern continent."
 canarie_andes_title:0 "Andine Conquest"
 canarie_andes_desc:0 "The lush interior valleys and highlands of the Andes await our banners. Bringing these fertile regions under our scepter guarantees inexhaustible riches for the crown."
 canarie_new_empire_title:0 "Dalmatia Nova"
 canarie_new_empire_desc:0 "The vast territories of Mesoamerica are now knit into a unified realm under our laws, standing as a proud kingdom to our endurance: Dalmatia Nova."
 canarie_aztec_title:0 "Fighting Gold"
 canarie_aztec_desc:0 "Tales of stone cities draped in pure gold and guarded by fearless armies beckon our veterans to march inland and claim the highland riches."
 canarie_mayans_title:0 "Mayan Conquest"
 canarie_mayans_desc:0 "Ancient limestone pyramids and fiercely independent jungle kingdoms dot the Yucatán. Bringing these coastal realms under our sway secures the eastern seas."
 canarie_destroy_aztecs_title:0 "Aztec Conquest"
 canarie_destroy_aztecs_desc:0 "Tenochtitlan has fallen to our steel and faith. The obsidian throne lies shattered, and the realm of the Mexica now bows before the Dalmatian crown."
 canarie_jungle_title:0 "Welcome to the Jungle"
 canarie_jungle_desc:0 "Hostile terrain, tropical fevers, and dense canopies test our men to their absolute limits, yet Dalmatian grit knows how to carve roads through the wild."
 canarie_port_title:0 "Emporium of the Atlantic"
 canarie_port_desc:0 "Our harbors welcome fleets laden with silver, sugar, and exotic timber, cementing our islands as the undisputed crossroads of the Atlantic basin."
 canarie_zacatecas_title:0 "Fortunes of the Sierra"
 canarie_zacatecas_desc:0 "Veins of dazzling silver run deep within the arid mountains of Zacatecas, providing the mineral wealth needed to fund our grandest continental ambitions."
 canarie_rio_grande_title:0 "Northern Frontier"
 canarie_rio_grande_desc:0 "Pushing past the arid deserts, our outposts and fortified missions along the Rio Grande establish a secure northern march for our expanding empire."
 canarie_california_full_title:0 "The Golden Coast"
 canarie_california_full_desc:0 "From fertile valleys to magnificent natural bays, our dominion over the California coastline is unchallenged by foreign rivals."
 canarie_new_world_silver_title:0 "Wealth of the Western Hills"
 canarie_new_world_silver_desc:0 "The continuous extraction of American bullion fills our royal treasuries, giving our kingdom the financial weight to dictate terms across world markets."
 canarie_triangle_trade_title:0 "Transatlantic Trade"
 canarie_triangle_trade_desc:0 "Convoys of armed merchant galleons link the Old World, the African coasts, and the American viceroyalties under the watchful eye of our navy."
 canarie_fecho_imperio_title:0 "The Dalmatian Sun Never Sets"
 canarie_fecho_imperio_desc:0 "A realm spanning distant archipelagos, continental empires, and infinite sea lanes now answers to our throne. The Dalmatian banner greets every sunrise."
 canarie_wealth_power_title:0 "Ascendance of the Fortunate"
 canarie_wealth_power_desc:0 "Through unmatched mercantile dominance and sheer geopolitical audacity, the nation born on the Atlantic outposts now stands as a premier world power."
 canarie_hawaii_title:0 "Markets of Oceania"
 canarie_hawaii_desc:0 "Venturing deep into the Pacific expanse, remote island archipelagos serve as crucial waypoints for freshwater, trade escort, and transoceanic voyages."
 canarie_florida_forts_title:0 "The Atlantic Bulwark"
 canarie_florida_forts_desc:0 "Heavy stone citadels erected along the Florida coastline guard the vital Bahama Channel against predatory privateers and rival powers."
 canarie_native_missions_title:0 "Flocks of the New World"
 canarie_native_missions_desc:0 "Zealous clergy and well-ordered missions spread the Catholic faith to local populations, binding them into the moral and spiritual life of our realm."
 canarie_oceanian_trade_title:0 "Transpacific Galleons"
 canarie_oceanian_trade_desc:0 "Galleons laden with American silver depart across the western ocean to return with silks, fine porcelains, and precious spices from Asian ports."
 canarie_dominate_home_node_title:0 "The Sovereign Market"
 canarie_dominate_home_node_desc:0 "No merchant ship enters our waters without paying homage and tribute to our customs houses. Our home node is now the undisputed economic heart of the world."
 canarie_knights_of_santiago_title:0 "Knights of Santiago"
 canarie_knights_of_santiago_desc:0 "Carrying on our ancient crusader heritage, we patronize noble military orders to sanctify our frontier borders and defend the church."
 canarie_renaissance_title:0 "The Classical Rebirth"
 canarie_renaissance_desc:0 "The intellectual flame of our Mediterranean heritage burns bright once more, inspiring a magnificent revival of classical philosophy, humanism, and art."
 canarie_arsenal_title:0 "The Atlantic Arsenal"
 canarie_arsenal_desc:0 "Industrial docks, standardized shipbuilding, and vast ropewalks ensure our naval yards can assemble and maintain the mightiest fleet on the high seas."
 canarie_papal_favor_title:0 "Connections in Rome"
 canarie_papal_favor_desc:0 "Steadfast devotion to the Holy See and lavish gifts to the Vatican secure the Papacy's firm blessing, legitimizing our royal lineage across Christendom."
 canarie_priting_press_title:0 "Diffusion of Knowledge"
 canarie_priting_press_desc:0 "The rhythmic clanking of moveable type reverberates across our realm, disseminating royal laws, navigation maps, and scientific treaties without delay."
 canarie_university_title:0 "The Academy of the West"
 canarie_university_desc:0 "Honoring the scholarly legacy of Cluni that guided our rulers, our universities train a new generation of jurists, navigators, and administrators."
 canarie_tercios_system_title:0 "Squares of Steel"
 canarie_tercios_system_desc:0 "Combining disciplined pikemen with disciplined arquebusiers, our infantry regiments adopt impenetrable square formations capable of breaking any charge."
 canarie_new_pillings_title:0 "Urban Flourishing"
 canarie_new_pillings_desc:0 "Reclaiming tidal marshlands and driving deep stone foundations allows our coastal towns to blossom into densely populated and magnificent cities."
 canarie_promote_carnival_title:0 "Feast of the Fortunate"
 canarie_promote_carnival_desc:0 "Vibrant masked balls, lavish street spectacles, and theatrical parades celebrate the miraculous survival and prosperity of our people."
 canarie_army_reforms_title:0 "Reformation of the Army"
 canarie_army_reforms_desc:0 "Moving beyond disorganized levies and volatile mercenaries, we build a permanent standing military drilled to perfection and directly funded by the crown."
 canarie_modern_warfare_title:0 "Mastery of Gunpowder"
 canarie_modern_warfare_desc:0 "Rolling musket volleys and synchronized field artillery define our military doctrine, allowing our troops to dictate the flow of European and colonial battlefields."
 canarie_reform_tercios_title:0 "The Steel Vanguard"
 canarie_reform_tercios_desc:0 "Forged in countless campaigns, our veteran tercios stand as an elite fighting corps renowned across the globe for their iron discipline."
 canarie_merchant_fleet_title:0 "The Great Armed Flotillas"
 canarie_merchant_fleet_desc:0 "Swift, well-armed merchant vessels sweep rival flags from the seas, steering foreign profits straight into Dalmatian hands."
 canarie_capital_expansion_title:0 "A City of Marble"
 canarie_capital_expansion_desc:0 "Humble wood gives way to polished stone, marble facades, and monumental squares, reflecting our realm's ascent from an exile camp to a royal capital."
 canarie_capital_of_new_world_title:0 "Jewel of the West"
 canarie_capital_of_new_world_desc:0 "Our capital has grown into an architectural marvel, outshining the ancient metropolises of the Old World in wealth, learning, and grandeur."
 canarie_teathers_title:0 "The Grand Theatres"
 canarie_teathers_desc:0 "Playwrights and actors find patron support in our royal theaters, staging epic tales of our ancestral journey from Ragusa across the stormy ocean."
 canarie_economic_reforms_title:0 "Mercantile Consolidation"
 canarie_economic_reforms_desc:0 "Rationalizing coinage, lowering internal tariffs, and supporting state-chartered trading guilds ensure continuous financial dominance."
 canarie_new_capital_title:0 "The Atlantic Metropolis"
 canarie_new_capital_desc:0 ""
 canarie_law_and_order_title:0 "High Courts of Justice"
 canarie_law_and_order_desc:0 "Codifying our laws and establishing royal courts of appeal brings swift justice to every province, putting an end to feudal chaos and lawlessness."
 canarie_doctor_training_title:0 "Conquering the Pestilence"
 canarie_doctor_training_desc:0 "Remembering the devastating plagues of the past, we fund organized medical academies and trained physicians to safeguard our citizens' lives."
 canarie_caribbean_home_title:0 "Caribbean Home"
 canarie_caribbean_home_desc:0 "The great island of Hispaniola must become our foremost staging ground, providing deep anchorages and fertile lands for our vanguard."
 canarie_eastern_peninsula_title:0 "The Sunlit Peninsula"
 canarie_eastern_peninsula_desc:0 "Charting the shores of Florida provides a vital northern sentinel over the Gulf of Mexico, keeping rival armadas far from our colonial core."
 canarie_california_title:0 "The Far West"
 canarie_california_desc:0 "Beyond rugged ranges lies the peaceful western ocean. Establishing footholds on the Californian coast opens a new frontier for our adventurous colonists."
 canarie_federations_title:0 "System of Federations"
 canarie_federations_desc:0 "Governing lands divided by wide oceans requires specialized councils, ensuring colonial viceroyalties and home provinces operate in complete harmony."
 canarie_conquistador_title:0 "The Wolf's Vanguard"
 canarie_conquistador_desc:0 "Carrying the memory of Marinus the Wolf-Slayer into uncharted lands, our finest commanders lead battle-hardened regiments deep into the wilderness."
