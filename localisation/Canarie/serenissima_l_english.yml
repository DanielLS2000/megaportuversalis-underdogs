l_english:
 new_world_academies: "New World Academies"
 new_world_academies_desc: "The staggering wealth flowing through our ports has been turned toward the pursuit of the intellect. Building upon the scholarly traditions that once led our rulers across Europe, we have founded unrivaled academies and institutes across our realm. Scholars, cartographers, and engineers from all over the world flock to our halls, placing our nation at the cutting edge of every modern science."
 crossroads_of_the_new_world: "Crossroads of the New World"
 crossroads_of_the_new_world_desc: "No merchant vessel sails between the hemispheres without docking in our waters, and no rare cargo reaches market without filling our treasury. Our harbors have become the central axis around which the entire global economy turns. From Atlantic ports to Pacific outposts, our trade companies dictate the terms of world commerce."
 imperial_tercios_of_the_west: "Imperial Tercios of the West"
 imperial_tercios_of_the_west_desc: "Gone are the days when our survival depended on small bands of desperate mercenaries. Backed by transatlantic fortunes, our state now levies massive standing armies disciplined to perfection. Formed into unyielding blocks and armed with the finest firearms produced by modern metallurgy, our tercios break hostile frontlines with relentless, rolling volleys of shot and fire."
 the_great_silver_routes: "The Great Silver Routes"
 the_great_silver_routes_desc: "Endless convoys of armed galleons and trade escorts stitch the silver mines of the Americas to our industrial heartlands. By ensuring absolute security along our oceanic arteries, colonial production operates at unprecedented capacity, transforming raw minerals and exotic harvests into an uninterrupted stream of manufactured wealth."
